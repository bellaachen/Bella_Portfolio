<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.ico" sizes="32x32"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Group Prototype | Bella Chen</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet spec panel on the left (stacks below on phones), one device frame on a washi-grey stage. Single light look by choice. */
:root{
  color-scheme: light;
  --paper:#F3F4F1; --stage:#E9EBE6; --ink:#24282C; --ink-2:#5D646A; --ink-3:#8E959A;
  --line:#DFE2DC; --card:#FFFFFF; --feed:#F1F2EE;
  --accent:#D4627A; --accent-ink:#B44C64; --accent-soft:#FBEAEE;
  --ok:#4F8A6B;
  --r-like:#4F79A8; --r-love:#D4627A; --r-haha:#C99A2E; --r-wow:#C99A2E; --r-angry:#CF6E3A;
  --f-panel:"Zen Kaku Gothic New", "Hiragino Sans", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --f-app:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-panel);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));background:rgba(243,244,241,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ph-brand{font-size:16px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.ph-lang{display:flex;border:1px solid #8F8D84;border-radius:999px;padding:2px}
.ph-lang button{font-size:12px;padding:4px 10px;min-height:28px;border-radius:999px;color:var(--ink)}
.ph-lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
html.embedded .ph-head{display:none}
.page{min-height:calc(100% - 69px);display:grid;grid-template-columns:minmax(300px,380px) 1fr}
html.embedded .page{min-height:100%}
/* ---------- panel ---------- */
.panel{padding-block:32px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:28px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line);min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.p-title{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.ai-badge{display:inline-block;font-size:11.5px;color:var(--ink-2);background:var(--stage);border-radius:999px;padding:3px 10px;margin:2px 0 10px}
.p-sub{color:var(--ink-2);font-size:14px;line-height:1.7;margin:0}
.seg{display:inline-flex;background:var(--stage);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(36,40,44,.12);font-weight:500}
.p-sec{display:flex;flex-direction:column;gap:10px}
.p-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin:0}
.flows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:f}
.flows button{width:100%;text-align:left;display:flex;gap:12px;align-items:baseline;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink-2)}
.flows button:hover{background:var(--stage)}
.flows button[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.flows .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:18px}
.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ratio{border:1px solid var(--line);border-radius:12px;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);position:relative}
.ratio[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ratio .shape{width:44px;background:linear-gradient(160deg,#E7C7CF,#BFD3E6);border-radius:4px}
.ratio .lab{font-size:12px;font-weight:500}
.ratio .rt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.ratio .final{position:absolute;top:-8px;right:-6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.metric{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric dt{color:var(--ink-2)}
.metric dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.metric dd.yes{color:var(--ok)} .metric dd.no{color:var(--accent-ink)}
.ratio-note{font-size:13px;color:var(--ink-2);line-height:1.65;margin:0}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{font-size:13.5px;line-height:1.65;color:var(--ink-2);padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.demo-btn{align-self:flex-start;border:1px dashed var(--ink-3);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
.demo-btn:hover{border-color:var(--ink);color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.6;margin:0}
.p-foot{margin-top:auto;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
/* ---------- stage ---------- */
.stage{display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--stage);min-width:0;position:sticky;top:69px;height:calc(100vh - 69px)}
html.embedded .stage{top:0;height:100vh}
.fit{position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:50px;background:var(--card);position:absolute;top:9px;left:9px;transform-origin:0 0;overflow:hidden;box-shadow:0 0 0 9px #D5D8D2,0 0 0 10px #C7CBC4,0 30px 60px -20px rgba(36,40,44,.35);font-family:var(--f-app);color:var(--ink);isolation:isolate}
/* ---------- app ---------- */
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:15px;font-weight:700;pointer-events:none;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;transition:color .2s}
.status.light{color:#fff}
.status .ic{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);z-index:60;opacity:.85;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card)}
.screen.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}
.scr{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.topbar{flex:none;padding-top:44px;height:96px;display:flex;align-items:center;gap:6px;padding-left:8px;padding-right:8px;border-bottom:1px solid var(--line);background:var(--card)}
.topbar h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.center h1{text-align:center}
.topbar.plain{border-bottom:0}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--feed)}
.ib svg{width:22px;height:22px}
.txtbtn{padding:8px 10px;font-size:15px;font-weight:700;color:var(--accent-ink)}
.txtbtn[disabled]{color:var(--ink-3);cursor:default}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#3a3f44;overflow:hidden}
.av.sm{width:32px;height:32px;font-size:13px}
.av.xs{width:24px;height:24px;font-size:11px;border:2px solid #fff}
.av img,.gav img{width:100%;height:100%;object-fit:cover;display:block}
.gav{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;background:var(--feed)}
/* explore */
.ex-head{flex:none;padding-top:44px;padding-left:20px;padding-right:12px;display:flex;align-items:center;justify-content:space-between;height:100px}
.ex-head .brand{font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.ex-head h1{font-size:26px;margin:2px 0 0;font-weight:700}
.ex-create{display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-size:14px;font-weight:700}
.ex-create svg{width:18px;height:18px}
.sec{padding:14px 20px 6px}
.sec h2{font-size:15px;margin:0 0 12px;font-weight:700}
.mine{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 8px;scrollbar-width:none}
.mine::-webkit-scrollbar{display:none}
.gcard{flex:none;width:200px;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:left}
.gcard .cv{aspect-ratio:16/9;overflow:hidden;background:var(--feed)}
.gcard .cv img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .gb{display:flex;gap:10px;align-items:center;padding:10px 12px 12px}
.gcard .gav{width:36px;height:36px;border-radius:11px;margin-top:-26px;box-shadow:0 0 0 3px #fff}
.gname{font-weight:700;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmeta{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.gmeta svg{width:13px;height:13px}
.grow{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.grow + .grow{border-top:1px solid var(--line)}
.grow .gi{flex:1;min-width:0}
.chip-btn{flex:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.chip-btn.ghost{background:var(--feed);color:var(--ink-2)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:14px}
/* lobby */
.lob-bar{position:absolute;top:0;left:0;right:0;z-index:20;padding-top:44px;height:92px;display:flex;align-items:center;padding-left:6px;padding-right:6px;gap:4px;transition:background .2s, box-shadow .2s}
.lob-bar.solid{background:var(--card);box-shadow:0 1px 0 var(--line)}
.lob-bar .t{flex:1;font-weight:700;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lob-bar.show-t .t{opacity:1}
.lob-bar.over .ib{background:rgba(255,255,255,.88);width:36px;height:36px;margin:0 2px}
.lob-bar.over .ib svg{width:20px;height:20px}
.cover{position:relative;overflow:hidden;background:var(--feed)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.imm::after{content:"";position:absolute;inset:auto 0 0 0;height:56%;background:linear-gradient(to top,rgba(20,22,26,.62),rgba(20,22,26,0))}
.imm-info{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;color:#fff;display:flex;flex-direction:column;gap:6px}
.imm-info .gav{width:60px;height:60px;border-radius:18px;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.imm-info h2{font-size:24px;margin:6px 0 0;line-height:1.3;text-wrap:balance}
.imm-info .gmeta{color:rgba(255,255,255,.88);font-size:13px}
.info{padding:0 20px 16px;background:var(--card)}
.info.std .gav{width:72px;height:72px;border-radius:20px;margin-top:-36px;position:relative;box-shadow:0 0 0 4px #fff}
.info.std h2{font-size:22px;margin:10px 0 4px;line-height:1.3}
.info .gmeta{font-size:13px}
.info .row{display:flex;gap:8px;margin-top:14px;align-items:center}
.mbtn{flex:1;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14.5px}
.mbtn svg{width:18px;height:18px}
.mbtn.fill{background:var(--accent);color:#fff}
.mbtn.out{background:var(--feed);color:var(--ink)}
.mbtn.pend{background:var(--feed);color:var(--ink-2)}
.mbtn.inv{flex:none;padding:0 16px;background:var(--feed)}
.members{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.members .stack{display:flex}
.members .stack .av + .av{margin-left:-8px}
.tabs{position:sticky;top:92px;z-index:10;background:var(--card);display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{flex:1;padding:12px 0 11px;font-size:14px;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.feed{background:var(--feed);padding-bottom:40px;display:flex;flex-direction:column;gap:8px;padding-top:8px;min-height:420px}
.composer{background:var(--card);display:flex;align-items:center;gap:10px;padding:12px 16px}
.composer .fake{flex:1;height:38px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;color:var(--ink-3);font-size:14px;text-align:left}
.composer .ib svg{color:var(--ok)}
.upbar{background:var(--card);padding:12px 16px;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.upbar .bar{flex:1;height:4px;border-radius:2px;background:var(--feed);overflow:hidden}
.upbar .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:load 1.4s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.lockbox{background:var(--card);padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lockbox svg{width:34px;height:34px;color:var(--ink-3)}
.lockbox h3{margin:6px 0 0;font-size:16px}
.lockbox p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.7}
.fab{position:absolute;right:18px;bottom:34px;z-index:15;width:54px;height:54px;border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(36,40,44,.45);transition:transform .2s, opacity .2s}
.fab svg{width:24px;height:24px}
.fab.off{opacity:0;transform:translateY(16px) scale(.9);pointer-events:none}
/* post */
.post{background:var(--card);padding-top:14px}
.ph{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px}
.ph .pm{flex:1;min-width:0}
.pn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.badge{font-size:10.5px;font-weight:700;color:var(--ok);background:#E5F0EA;border-radius:5px;padding:1px 6px}
.pt{font-size:12px;color:var(--ink-3)}
.ptext{padding:10px 16px 12px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;text-align:left;width:100%;display:block}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morel{display:block;padding:2px 16px 12px;font-size:14px;color:var(--ink-2);font-weight:700}
.imgs{display:grid;gap:3px;cursor:pointer}
.imgs img{width:100%;height:100%;object-fit:cover;display:block;background:var(--feed)}
.imgs .c{position:relative;overflow:hidden}
.imgs.n1 .c{aspect-ratio:4/3}
.imgs.n2{grid-template-columns:1fr 1fr}.imgs.n2 .c{aspect-ratio:1}
.imgs.n3{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}.imgs.n3 .c:first-child{grid-column:1/3;aspect-ratio:16/9}.imgs.n3 .c{aspect-ratio:1}
.imgs.n4{grid-template-columns:1fr 1fr}.imgs.n4 .c{aspect-ratio:1}
.imgs .plus{position:absolute;inset:0;background:rgba(20,22,26,.45);color:#fff;font-size:26px;font-weight:700;display:grid;place-items:center}
.embed{margin:0 16px 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:block;width:calc(100% - 32px)}
.embed .eh{display:flex;gap:8px;align-items:center;padding:10px 12px 0}
.embed .et{padding:6px 12px 10px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.embed img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.embed .src{font-size:11.5px;color:var(--ink-3);padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.psum{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:13px;color:var(--ink-2);gap:8px}
.psum .rx{display:flex;align-items:center;gap:6px;min-width:0}
.emo{display:flex}
.emo span{width:20px;height:20px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 2px var(--card)}
.emo span + span{margin-left:-4px}
.pact{display:flex;border-top:1px solid var(--line);margin:0 12px;padding:2px 0 4px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:10px;font-size:14px;color:var(--ink-2);font-weight:500;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.act:hover{background:var(--feed)}
.act svg{width:20px;height:20px}
.act .e{font-size:18px;line-height:1}
.act.on{font-weight:700}
/* detail & comments */
.cmts{padding:6px 16px 24px;background:var(--card);border-top:8px solid var(--feed)}
.cmts h3{font-size:14px;margin:12px 0 10px;color:var(--ink-2);font-weight:700}
.cm{display:flex;gap:8px;padding:6px 0}
.cm.reply{margin-left:40px}
.cb{flex:1;min-width:0}
.bubble{background:var(--feed);border-radius:16px;padding:8px 12px;display:inline-block;max-width:100%;transition:box-shadow .2s}
.cm.focus .bubble{box-shadow:0 0 0 2px var(--accent)}
.cn{font-size:13px;font-weight:700}
.ct{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mention{color:var(--r-like);font-weight:700}
.cmeta{display:flex;align-items:center;gap:14px;padding:4px 4px 0;font-size:12px;color:var(--ink-3)}
.lnk{font-weight:700;color:var(--ink-2);font-size:12px;padding:2px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.lnk.on{color:var(--accent-ink)}
.cr{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--ink-2)}
.cr .emo span{width:17px;height:17px;font-size:11px}
.more-in{font-weight:700;color:var(--ink-2);font-size:13px;display:block;padding-top:2px}
.ibar{flex:none;border-top:1px solid var(--line);background:var(--card);padding:8px 12px 34px}
.ibar .replying{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);padding:2px 4px 8px}
.ibar .replying b{color:var(--ink)}
.ibar .row{display:flex;gap:8px;align-items:center}
.ibar input{flex:1;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--feed);padding:0 16px;font:inherit;font-size:14.5px;color:var(--ink)}
.ibar .send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.ibar .send[disabled]{color:var(--ink-3)}
.ibar .send svg{width:22px;height:22px}
/* compose */
.cmp-who{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.cmp-to{font-size:12px;color:var(--ink-3)}
.cmp textarea{width:100%;border:0;resize:none;padding:10px 16px;font:inherit;font-size:16px;line-height:1.7;min-height:180px;color:var(--ink);background:transparent}

.media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 12px}

.step{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.cr-h{font-size:22px;font-weight:700;margin:0;line-height:1.4;text-wrap:balance}

.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}

.field .c{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.errt{color:var(--accent-ink);font-size:12.5px;margin-top:6px;min-height:18px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}

.fixed-cta{flex:none;padding:12px 20px 38px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.cta{height:50px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.cta[disabled]{background:#E6E8E3;color:var(--ink-3);cursor:default}

.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}

.done-art{display:grid;place-items:center;padding:40px 0 10px;position:relative}

.pv-av .wrap{position:relative}

.cam{position:absolute;right:-6px;bottom:-6px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}

.about{background:var(--card);padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px}

.dialog{position:relative;margin:auto 36px;background:var(--card);border-radius:18px;text-align:center;padding:22px 20px 0;animation:fade .2s}
.dialog h3{margin:0 0 6px;font-size:16px}
.dialog p{margin:0 0 18px;font-size:14px;color:var(--ink-2);line-height:1.6}
.dialog .btns{display:flex;border-top:1px solid var(--line);margin:0 -20px}
.dialog .btns button{flex:1;padding:14px;font-size:15px}
.dialog .btns button + button{border-left:1px solid var(--line)}
.dialog .btns .d{color:var(--accent-ink);font-weight:700}
.picker-layer{position:absolute;inset:0;z-index:55}
.picker-layer[hidden]{display:none}
.picker{position:absolute;display:flex;gap:2px;background:var(--card);border-radius:999px;padding:5px 7px;box-shadow:0 10px 30px -8px rgba(36,40,44,.35),0 0 0 1px var(--line);animation:pop .18s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.7) translateY(10px);opacity:0}}
.picker button{width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;display:grid;place-items:center;position:relative;transition:transform .12s}
.picker button:hover,.picker button:focus-visible{transform:translateY(-6px) scale(1.18)}
.picker button .tip{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10.5px;background:var(--ink);color:#fff;padding:2px 6px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;font-family:var(--f-app)}
.picker button:hover .tip,.picker button:focus-visible .tip{opacity:1}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);z-index:70;background:rgba(36,40,44,.92);color:#fff;font-size:14px;line-height:1.5;padding:10px 18px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:300px;width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width: 900px){
  .page{grid-template-columns:1fr}
  .stage{position:static;height:auto;order:-1;padding-block:20px}
  .panel{border-right:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- generated artwork (original, no characters) ---------- */
const motif = (kind, x, y, s, f) => {
  const g = inner => `<g transform="translate(${x} ${y}) scale(${s})" fill="${f}">${inner}</g>`;

    case 'box': return g('<rect x="-28" y="-18" width="56" height="44" rx="9"/><rect x="-33" y="-30" width="66" height="16" rx="6"/>');

    case 'tv': return g('<rect x="-30" y="-18" width="60" height="42" rx="10"/><rect x="-3" y="-34" width="6" height="18" rx="3" transform="rotate(-30)"/><rect x="-3" y="-34" width="6" height="18" rx="3" transform="rotate(30)"/>');
    case 'star': return g('<path d="M0-26 7-8 26-8 11 3 17 22 0 11-17 22-11 3-26-8-7-8Z"/>');
    case 'lantern': return g('<rect x="-18" y="-20" width="36" height="44" rx="10"/><rect x="-10" y="-32" width="20" height="10" rx="4"/><circle cx="0" cy="2" r="9" fill="#fff" opacity=".7"/>');

    default: return g('<circle r="14"/>');

};
function coverArt(p, kind){
  const [a,b,c,d] = p;
  const dots = [[120,140,1],[640,110,.8],[520,240,.6],[230,300,.7],[700,330,.9],[380,120,.5]];
  return uri(SV('0 0 800 800',
    `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>

const G = id => S.groups.find(g => g.id === id);
const myName = () => loc(U.me);
function findPost(pid){ for (const g of S.groups) for (const p of g.posts) if (p.id === pid) return {g, p}; return null; }
function findTarget(key){
  const [type, id] = key.split('|');
  if (type === 'p') return findPost(id)?.p;
  for (const g of S.groups) for (const p of g.posts) for (const c of p.comments){
    if (c.id === id) return c;
    for (const r of c.replies) if (r.id === id) return r;
  }
}
const isMember = g => g.joined;
const cmtCount = p => p.comments.reduce((n,c) => n + 1 + c.replies.length, 0);
const rxTotal = r => Object.values(r).reduce((a,b) => a+b, 0);
const rxTop = r => Object.entries(r).filter(([,n]) => n > 0).sort((a,b) => b[1]-a[1]).slice(0,3).map(([k]) => k);

/* ================= rendering ================= */
const screen = $('#screen'), overlay = $('#overlay'), pickerLayer = $('#pickerLayer');
const cur = () => S.stack[S.stack.length - 1];
const av = (u, cls='') => `<span class="av ${cls}" style="background:${U[u].c}" aria-hidden="true">${esc(loc(U[u]).slice(0,1))}</span>`;
const gAvatar = (g, cls='gav') => `<span class="${cls}"><img src="${g.avatar}" alt=""></span>`;
const privMeta = g => `${g.priv ? I.lock : I.globe}<span>${t(g.priv ? 'private' : 'public')}</span>`;

function render(opts = {}){
  const sc = screen.querySelector('.scr');
  const prev = sc ? sc.scrollTop : 0;
  const c = cur();
  const html = SCREENS[c.s](c);
  screen.className = 'screen' + (opts.anim ? ' enter' : '');
  screen.innerHTML = html;
  const ns = screen.querySelector('.scr');
  if (ns){
    if (opts.anim) ns.scrollTop = c.scroll || 0; else ns.scrollTop = prev;
    if (c.s === 'lobby'){ ns.addEventListener('scroll', onLobbyScroll, {passive:true}); onLobbyScroll(); }
  }
  setStatus();
  if (opts.after) opts.after();
  if (c.s === 'lobby') measure();
  renderPanel();
}
function setStatus(){
  const c = cur(); const st = $('#status');
  let light = false;
  if (c.s === 'lobby' && S.ratio === 'imm'){ const sc = screen.querySelector('.scr'); light = !(sc && sc.scrollTop > coverH() - 100); }
  st.classList.toggle('light', light);
}
const coverH = () => S.ratio === 'imm' ? 470 : S.ratio === 'large' ? 292 : 219;

function go(s, params = {}){
  const sc = screen.querySelector('.scr'); if (sc) cur().scroll = sc.scrollTop;
  S.stack.push({s, ...params}); closePicker(); render({anim:true});
}
function back(){
  if (S.stack.length > 1){ S.stack.pop(); S.replying = null; closePicker(); render({anim:true}); }
}
function replaceTop(s, params = {}){ S.stack[S.stack.length-1] = {s, ...params}; render({anim:true}); }

const SCREENS = {};

/* ---- explore ---- */

/* ---- lobby ---- */
function memberBtn(g){
  if (g.joined) return `<button class="mbtn out" data-a="groupMore" data-gid="${g.id}">${I.check}${t('joined')}</button><button class="mbtn inv" data-a="invite" data-gid="${g.id}">${I.plus}${t('invite')}</button>`;
  if (g.pending) return `<button class="mbtn pend" data-a="pendingMenu" data-gid="${g.id}">${I.clock}${t('pending')}</button>`;
  return `<button class="mbtn fill" data-a="join" data-gid="${g.id}">${g.priv ? I.lock : I.plus}${t(g.priv ? 'request' : 'join')}</button>`;
}
function membersRow(g){
  if (g.priv && !g.joined) return '';
  const us = ['mimi','che','yuzu','bear','aoi'];
  return `<div class="members"><span class="stack">${us.map(u => av(u,'xs')).join('')}</span><span>${t('members', fmtN(g.members))}</span></div>`;
}
SCREENS.lobby = c => {
  const g = G(c.gid);

    <div class="cover" style="aspect-ratio:${aspect}"><img src="${g.cover}" alt=""></div>
    <div class="info std">${gAvatar(g)}<h2>${esc(loc(g.name))}</h2><div class="gmeta">${privMeta(g)}<span>·</span><span>${cat(g.cat)}</span></div>
      <div class="row">${memberBtn(g)}</div>${membersRow(g)}</div>`;
  const tabs = ['feed','about','members','photos'];
  const tl = L.tabs[S.lang === 'zh' ? 0 : 1];
  let body = '';

    if (locked) body = `<div class="lockbox">${I.lock}<h3>${t('lockedH')}</h3><p>${t('lockedP')}</p></div>`;
    else {
      body = (g.joined ? `<div class="composer" id="composerRow">${av('me','sm')}<button class="fake" data-a="compose" data-gid="${g.id}">${t('whatsNew')}</button><button class="ib" data-a="compose" data-gid="${g.id}" data-photo="1" aria-label="${t('photo')}">${I.image}</button></div>` : '')
        + (S.uploading === g.id ? `<div class="upbar"><span>${t('uploading')}</span><span class="bar"><i></i></span></div>` : '')
        + (g.posts.length ? g.posts.map(p => postCard(g, p, 'lobby')).join('') : `<div class="empty" style="background:var(--card)">${t('noPosts')}</div>`);
    }
  } else if (tab === 'about') body = aboutTab(g);
  else if (tab === 'members') body = locked ? `<div class="lockbox">${I.lock}<h3>${t('lockedH')}</h3><p>${t('lockedP')}</p></div>` : membersTab(g);
  else body = locked ? `<div class="lockbox">${I.lock}<h3>${t('lockedH')}</h3><p>${t('lockedP')}</p></div>` : photosTab(g);
  return `
  <div class="lob-bar ${imm ? 'over' : 'solid'}" id="lobBar">
    <button class="ib" data-a="back" aria-label="Back">${I.back}</button>
    <span class="t">${esc(loc(g.name))}</span>
    <button class="ib" data-a="groupMore" data-gid="${g.id}" aria-label="More">${I.more}</button>
  </div>
  <div class="scr">
    ${head}
    <div class="tabs" role="tablist">${tabs.map((k,i) => `<button role="tab" aria-selected="${tab===k}" data-a="tab" data-v="${k}">${tl[i]}</button>`).join('')}</div>
    <div class="feed">${body}</div>
  </div>
  ${g.joined && tab === 'feed' ? `<button class="fab off" id="fab" data-a="compose" data-gid="${g.id}" aria-label="${t('newPost')}">${I.pen}</button>` : ''}`;
};
function onLobbyScroll(){
  const sc = screen.querySelector('.scr'); const bar = $('#lobBar'); if (!sc || !bar) return;
  const y = sc.scrollTop, imm = S.ratio === 'imm';
  if (imm){ const solid = y > coverH() - 100; bar.classList.toggle('solid', solid); bar.classList.toggle('over', !solid); bar.classList.toggle('show-t', solid); }
  else bar.classList.toggle('show-t', y > coverH() + 40);
  const fab = $('#fab'), comp = $('#composerRow');
  if (fab && comp) fab.classList.toggle('off', y < comp.offsetTop + comp.offsetHeight - 92);
  setStatus();
}
function measure(){
  const sc = screen.querySelector('.scr'); const first = sc && sc.querySelector('.post');
  const vh = 844;
  const coverPx = coverH() + (S.ratio === 'imm' ? 0 : 92);
  S.metric = { cover: Math.round(coverH() / vh * 100), firstTop: first ? Math.round(first.offsetTop) : null, visible: first ? first.offsetTop + 180 < vh : false, ratio:S.ratio };
}

/* ---- post card ---- */
function rxSummary(target, key){
  const total = rxTotal(target.r);
  if (!total) return `<span></span>`;
  const top = rxTop(target.r);
  const label = target.mine ? t('youAnd', total - 1) : fmtN(total);
  return `<button class="rx" data-a="reactList" data-k="${key}"><span class="emo">${top.map(k => `<span>${RXM[k].e}</span>`).join('')}</span><span>${label}</span></button>`;
}
function reactBtn(target, key, cls = 'act'){
  const m = target.mine ? RXM[target.mine] : null;
  const label = m ? m[S.lang] : t('like');
  const inner = cls === 'act' ? (m ? `<span class="e">${m.e}</span>` : I.like) + `<span>${label}</span>` : label;
  return `<button class="${cls} ${m ? 'on' : ''}" data-rk="${key}" ${m ? `style="color:${m.c}"` : ''} aria-label="${label}" title="${S.lang==='zh'?'長按可選擇心情':'Press and hold for more reactions'}">${inner}</button>`;
}
function imgGrid(p, g, where){
  const n = p.imgs.length; if (!n) return '';
  const shown = p.imgs.slice(0, 4); const cls = n >= 4 ? 'n4' : 'n' + n;
  return `<div class="imgs ${cls}" data-a="openPost" data-gid="${g.id}" data-pid="${p.id}">${shown.map((src,i) => `<div class="c"><img src="${src}" alt="">${i === 3 && n > 4 ? `<span class="plus">+${n-4}</span>` : ''}</div>`).join('')}</div>`;
}
function embedCard(ref){
  const f = findPost(ref.pid); if (!f) return '';
  const {g, p} = f;
  return `<button class="embed" data-a="openPost" data-gid="${g.id}" data-pid="${p.id}">
    ${p.imgs[0] ? `<img src="${p.imgs[0]}" alt="">` : ''}
    <div class="eh">${av(p.author,'xs')}<span class="pn" style="font-size:13px">${esc(loc(U[p.author]))}</span></div>
    <div class="et clamp2">${esc(loc(p.text))}</div>
    <div class="src">${gAvatar(g,'av xs')}<span>${t('from', esc(loc(g.name)))}</span></div></button>`;
}
function postCard(g, p, where){
  const key = 'p|' + p.id;
  const txt = loc(p.text);
  const long = where === 'lobby' && txt.length > (S.lang === 'zh' ? 70 : 160) && !S.expanded.has(p.id);
  const cc = cmtCount(p);
  return `<article class="post" id="post-${p.id}">
    <header class="ph">${av(p.author)}<div class="pm"><div class="pn">${esc(loc(U[p.author]))}${p.author === g.admin ? `<span class="badge">${t('admin')}</span>` : ''}${p.shared ? `<span style="font-weight:400;color:var(--ink-3);font-size:13px">${t('sharedPost')}</span>` : ''}</div><div class="pt">${fmtT(p.mins)}</div></div><button class="ib" aria-label="More">${I.more}</button></header>
    ${txt ? `<button class="ptext ${long ? 'clamp4' : ''}" ${where === 'lobby' ? `data-a="openPost" data-gid="${g.id}" data-pid="${p.id}"` : 'tabindex="-1"'}>${esc(txt)}</button>${long ? `<button class="morel" data-a="expand" data-id="${p.id}">${t('showMore')}</button>` : ''}` : '<div style="height:10px"></div>'}
    ${p.shared ? embedCard(p.shared) : imgGrid(p, g, where)}
    <div class="psum">${rxSummary(p, key)}<span>${cc ? (where === 'lobby' ? `<button data-a="openPost" data-gid="${g.id}" data-pid="${p.id}">${t('nComments', cc)}</button>` : t('nComments', cc)) : ''}${cc && p.shares ? ' · ' : ''}${p.shares ? t('nShares', p.shares) : ''}</span></div>
    <div class="pact">${reactBtn(p, key)}<button class="act" data-a="commentBtn" data-gid="${g.id}" data-pid="${p.id}">${I.comment}<span>${t('comment')}</span></button><button class="act" data-a="share" data-pid="${p.id}">${I.share}<span>${t('share')}</span></button></div>
  </article>`;
}

/* ---- detail ---- */

    </div></div>`;
}
function top_of(rid){ for (const g of S.groups) for (const p of g.posts) for (const c of p.comments) if (c.replies.some(r => r.id === rid)) return c.id; return rid; }

/* reactions */
function canReact(key){
  const [type,id] = key.split('|');
  let g;
  if (type === 'p') g = findPost(id).g;
  else for (const gg of S.groups) for (const p of gg.posts) for (const c of p.comments) if (c.id === id || c.replies.some(r => r.id === id)) g = gg;
  return g && g.joined;
}
function setReaction(key, type){
  const tg = findTarget(key);
  if (tg.mine) tg.r[tg.mine]--;
  if (type && tg.mine !== type){ tg.mine = type; tg.r[type]++; }
  else if (type && tg.mine === type){ tg.mine = type; tg.r[type]++; }
  else tg.mine = null;
  render();
}
function tapReact(key){
  if (!canReact(key)) return toast(t('membersOnlyReact'));
  const tg = findTarget(key);
  setReaction(key, tg.mine ? null : 'like');
}
function openPicker(key, btn){
  if (!canReact(key)) return toast(t('membersOnlyReact'));
  const ph = $('#phone').getBoundingClientRect(), r = btn.getBoundingClientRect(), s = S.scale || 1;
  const w = 5*44 + 4*2 + 14;
  let x = (r.left - ph.left)/s - 8; x = Math.max(8, Math.min(390 - w - 8, x));
  let y = (r.top - ph.top)/s - 62; if (y < 50) y = (r.bottom - ph.top)/s + 8;
  pickerLayer.innerHTML = `<div class="picker" style="left:${x}px;top:${y}px" role="menu">${RX.map(rx => `<button role="menuitem" data-a="pick" data-k="${key}" data-t="${rx.k}" aria-label="${rx[S.lang]}">${rx.e}<span class="tip">${rx[S.lang]}</span></button>`).join('')}</div>`;
  pickerLayer.hidden = false;
  pickerLayer.querySelector('button').focus({preventScroll:true});
}
function closePicker(){ pickerLayer.hidden = true; pickerLayer.innerHTML = ''; }

let lp = null;
screen.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-rk]'); if (!b) return;
  lp = { b, x:e.clientX, y:e.clientY, fired:false, t:setTimeout(() => { if (lp){ lp.fired = true; openPicker(b.dataset.rk, b); } }, 420) };
});
document.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10){ clearTimeout(lp.t); lp = null; } });
document.addEventListener('pointerup', e => {
  if (!lp) return; clearTimeout(lp.t);
  const {b, fired} = lp; lp = null;
  if (!fired && e.target.closest('[data-rk]') === b) tapReact(b.dataset.rk);
});
document.addEventListener('pointercancel', () => { if (lp){ clearTimeout(lp.t); lp = null; } });
screen.addEventListener('contextmenu', e => { if (e.target.closest('[data-rk]')) e.preventDefault(); });
pickerLayer.addEventListener('click', e => { if (e.target === pickerLayer) closePicker(); });

/* ================= actions ================= */
const A = {
  back, lang:d => { setLang(d.v, true); },
  ratio:d => { S.ratio = d.v; render(); },
  flow:d => {
    closeSheet(); closePicker(); S.replying = null;
    if (d.v === 'explore') S.stack = [{s:'explore'}];
    else if (d.v === 'lobby') S.stack = [{s:'explore'}, {s:'lobby', gid:'g1'}];
    else if (d.v === 'detail') S.stack = [{s:'explore'}, {s:'lobby', gid:'g1'}, {s:'detail', gid:'g1', pid:'p1'}];
    else if (d.v === 'compose'){ S.stack = [{s:'explore'}, {s:'lobby', gid:'g1'}]; return A.compose({gid:'g1'}); }
    else if (d.v === 'create'){ S.stack = [{s:'explore'}]; return A.startCreate(); }
    else if (d.v === 'join'){ S.stack = [{s:'explore'}, {s:'lobby', gid:'g4'}]; }
    render({anim:true});
  },
  open:d => go('lobby', {gid:d.gid}),
  openPost:d => go('detail', {gid:d.gid, pid:d.pid}),
  commentBtn:d => {
    const g = G(d.gid);
    if (cur().s === 'detail'){ if (!g.joined) return toast(t('membersOnlyComment')); $('#cmtIn').focus(); return; }
    go('detail', {gid:d.gid, pid:d.pid});
    if (g.joined) setTimeout(() => $('#cmtIn') && $('#cmtIn').focus({preventScroll:true}), 260);
  },
  expand:d => { S.expanded.add(d.id); render(); },
  tab:d => { cur().tab = d.v; render(); },
  join:d => {
    const g = G(d.gid);
    if (g.priv){ g.pending = true; toast(t('reqToast')); }
    else { g.joined = true; g.members++; toast(t('joinedToast')); }
    render();
  },
  pendingMenu:d => openSheet(`<p class="sub" style="margin-top:4px">${t('pendingToast')}</p><div class="list"><button class="srow danger" data-a="cancelReq" data-gid="${d.gid}"><span class="si">${I.x}</span><span class="grow-1">${t('cancelReq')}</span></button><button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`),
  cancelReq:d => { G(d.gid).pending = false; closeSheet(); toast(t('cancelReqToast')); render(); },
  approve:d => { const g = G(d.gid); g.pending = false; g.joined = true; g.members++; toast(t('approved', loc(g.name))); render(); },
  groupMore:d => {
    const g = G(d.gid);
    openSheet(`<div class="list">
      ${g.joined ? `<button class="srow" data-a="invite" data-gid="${g.id}"><span class="si">${I.users}</span><span class="grow-1">${t('inviteFriends')}</span></button>` : ''}
      <button class="srow" data-a="copy"><span class="si">${I.link}</span><span class="grow-1">${t('copyGroupLink')}</span></button>
      ${g.joined && g.admin !== 'me' ? `<button class="srow danger" data-a="leaveAsk" data-gid="${g.id}"><span class="si">${I.out}</span><span class="grow-1">${t('leave')}</span></button>` : ''}
      <button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`);
  },
  leaveAsk:d => { const g = G(d.gid); openSheet(`<h3>${t('leaveQ', esc(loc(g.name)))}</h3><p>${t('leaveP')}</p><div class="btns"><button data-a="closeSheet">${t('cancel')}</button><button class="d" data-a="leave" data-gid="${g.id}">${t('leaveBtn')}</button></div>`, 'dialog'); },
  leave:d => { const g = G(d.gid); g.joined = false; g.members--; closeSheet(); toast(t('left')); render(); },
  invite:d => {
    const friends = ['che','aoi','dou','momo','kai','yuzu'];
    S.invited = S.invited || new Set();
    openSheet(`<h3>${t('inviteFriends')}</h3><p class="sub">${t('inviteSub')}</p><div class="list">
      ${friends.map(u => `<div class="srow">${av(u)}<span class="grow-1">${esc(loc(U[u]))}</span><button class="chip-btn ${S.invited.has(u) ? 'ghost' : ''}" data-a="inviteOne" data-u="${u}" data-gid="${d.gid}">${t(S.invited.has(u) ? 'invited' : 'invite')}</button></div>`).join('')}
      <button class="srow" data-a="copy"><span class="si">${I.link}</span><span class="grow-1">${t('copyGroupLink')}</span></button></div>`);
  },
  inviteOne:d => { S.invited.add(d.u); A.invite(d); },
  copy:() => { closeSheet(); toast(t('copied')); },
  closeSheet,
  pick:d => { closePicker(); setReaction(d.k, d.t); },
  reactList:d => {
    const tg = findTarget(d.k); const types = rxTop(tg.r).concat(Object.keys(tg.r).filter(k => tg.r[k] > 0 && !rxTop(tg.r).includes(k)));
    const sel = d.sel || 'all';
    const people = ['mimi','che','yuzu','bear','aoi','dou','momo','kai'];
    const n = sel === 'all' ? rxTotal(tg.r) : tg.r[sel];
    const list = (tg.mine && (sel === 'all' || sel === tg.mine) ? ['me'] : []).concat(people).slice(0, Math.min(8, n));
    openSheet(`<h3>${t('reactions')}</h3><p class="sub">${t('people', fmtN(rxTotal(tg.r)))}</p>
      <div class="rtabs"><button aria-pressed="${sel==='all'}" data-a="reactList" data-k="${d.k}" data-sel="all">${t('all')} ${fmtN(rxTotal(tg.r))}</button>${types.map(k => `<button aria-pressed="${sel===k}" data-a="reactList" data-k="${d.k}" data-sel="${k}">${RXM[k].e} ${fmtN(tg.r[k])}</button>`).join('')}</div>
      <div class="list">${list.map((u, idx) => `<div class="srow">${av(u)}<span class="grow-1">${esc(loc(U[u]))}</span><span>${u === 'me' ? RXM[tg.mine].e : RXM[sel === 'all' ? types[idx % types.length] : sel].e}</span></div>`).join('')}</div>`);
  },
  /* share */
  share:d => {
    const {g, p} = findPost(d.pid);
    S.sharePid = d.pid;
    const thumb = p.imgs[0] || (p.shared && findPost(p.shared.pid)?.p.imgs[0]) || g.avatar;
    openSheet(`<h3>${t('shareTitle')}</h3>
      <div class="mini"><img src="${thumb}" alt=""><div><div class="pn" style="font-size:13px">${esc(loc(U[p.author]))}</div><div class="tx">${esc(loc(p.text))}</div></div></div>
      <div class="note">${I.info}<span>${t('shareNote')}</span></div>
      <div class="list">
        <button class="srow" data-a="shareGroups"><span class="si">${I.users}</span><span class="grow-1">${t('toGroup')}<small>${t('toGroupSub')}</small></span></button>
        <button class="srow" data-a="shareProfile"><span class="si">${I.user}</span><span class="grow-1">${t('toProfile')}<small>${t('toProfileSub')}</small></span></button>
        <button class="srow" data-a="shareCopy"><span class="si">${I.link}</span><span class="grow-1">${t('copyLink')}<small>${t('copyLinkSub')}</small></span></button>
        <button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`);
  },
  shareGroups:() => {
    const mine = S.groups.filter(g => g.joined);
    openSheet(`<h3>${t('pickGroup')}</h3><div class="note" style="margin-top:6px">${I.info}<span>${t('shareNote')}</span></div><div class="list">
      ${mine.length ? mine.map(g => `<button class="srow" data-a="shareTo" data-gid="${g.id}">${gAvatar(g,'si')}<span class="grow-1">${esc(loc(g.name))}<small>${t('members', fmtN(g.members))}</small></span></button>`).join('') : `<div class="empty">${t('noGroups')}</div>`}
      <button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`);
  },
  shareTo:d => {
    const src = findPost(S.sharePid); const orig = src.p.shared ? src.p.shared.pid : src.p.id;
    const tg = G(d.gid);
    tg.posts.unshift({ id:nid('p'), author:'me', mins:0, imgs:[], r:R(), mine:null, shares:0, text:{zh:'',en:''}, shared:{pid:orig}, comments:[] });
    src.p.shares++; closeSheet(); toast(t('shared')); render();
  },
  shareProfile:() => { findPost(S.sharePid).p.shares++; closeSheet(); toast(t('sharedProfile')); render(); },
  shareCopy:() => { closeSheet(); toast(t('copied')); },
  /* comments */
  membersOnly:() => toast(t('membersOnlyComment')),
  reply:d => {
    const g = G(cur().gid);
    if (!g.joined) return toast(t('membersOnlyReply'));
    S.replying = { top:d.top, focus:d.cid, u:d.u };
    render({ after:() => { const i = $('#cmtIn'); i.focus({preventScroll:true}); syncSend(); } });
  },
  cancelReply:() => { S.replying = null; render(); },
  sendComment:() => {
    const inp = $('#cmtIn'); const v = inp.value.trim(); if (!v) return;
    const {p} = findPost(cur().pid);
    const rp = S.replying; let newId = nid('c');
    if (rp){
      const top = p.comments.find(c => c.id === rp.top);
      top.replies.push({ id:newId, author:'me', mins:0, text:{zh:v,en:v}, r:R(), mine:null, replies:[], to: rp.u !== 'me' ? rp.u : null });
    } else p.comments.push({ id:newId, author:'me', mins:0, text:{zh:v,en:v}, r:R(), mine:null, replies:[] });
    S.replying = null;
    render({ after:() => { const el = $('#cm-' + newId); el && el.scrollIntoView({block:'center'}); } });
  },
  /* compose */
  compose:d => {
    const draft = S.drafts[d.gid];
    S.compose = draft ? {...draft, media:[...draft.media]} : { gid:d.gid, text:'', media:[] };
    go('compose');
    if (draft) toast(t('draftLoaded'));
    else if (d.photo) setTimeout(() => A.pickMedia({src:'file'}), 50);
    else setTimeout(() => $('#cmpTa') && $('#cmpTa').focus({preventScroll:true}), 240);
  },
  composeBack:() => {
    const cp = S.compose;
    if (!cp.text.trim() && !cp.media.length) return back();
    openSheet(`<h3>${t('draftQ')}</h3><div class="list" style="margin-top:6px">
      <button class="srow" data-a="draftSave"><span class="si">${I.pen}</span><span class="grow-1">${t('draftSave')}</span></button>
      <button class="srow danger" data-a="draftDiscard"><span class="si">${I.x}</span><span class="grow-1">${t('draftDiscard')}</span></button>
      <button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`);
  },
  draftSave:() => { S.drafts[S.compose.gid] = {...S.compose, media:[...S.compose.media]}; closeSheet(); back(); toast(t('draftSaved')); },
  draftDiscard:() => { delete S.drafts[S.compose.gid]; closeSheet(); back(); },
  pickMedia:d => {
    if (S.compose && S.compose.media.length >= 20) return toast(t('limitMedia'));
    S.fileTarget = 'compose'; (d.src === 'cam' ? $('#camIn') : $('#fileIn')).click();
  },
  sampleMedia:() => {
    const cp = S.compose; if (cp.media.length >= 20) return toast(t('limitMedia'));
    cp.media.push(IMG[SAMPLES[cp.media.length % SAMPLES.length]]); render();
  },
  rmMedia:d => { S.compose.media.splice(+d.i, 1); render(); },
  publish:() => {
    const cp = S.compose; if (!cp.text.trim() && !cp.media.length) return;
    const gid = cp.gid;
    delete S.drafts[gid];
    const post = { id:nid('p'), author:'me', mins:0, imgs:[...cp.media], r:R(), mine:null, shares:0, text:{zh:cp.text.trim(),en:cp.text.trim()}, comments:[] };
    S.uploading = gid; S.compose = null; back();
    const sc = screen.querySelector('.scr'); if (sc) sc.scrollTo({top: coverH(), behavior:'smooth'});
    setTimeout(() => { G(gid).posts.unshift(post); S.uploading = null; if (cur().s === 'lobby') render(); }, 1500);
  },
  /* create */
  startCreate:() => { S.create = { name:'', cat:null, err:null, av:0, cv:0, avatarCustom:null, coverCustom:null, intro:'', loading:false }; go('createName'); setTimeout(() => $('#cName') && $('#cName').focus({preventScroll:true}), 240); },
  createClose:() => { S.stack = S.stack.filter(x => !x.s.startsWith('create')); if (!S.stack.length) S.stack = [{s:'explore'}]; render({anim:true}); },
  cat:d => { S.create.cat = d.v; render(); },
  createSubmit:() => {
    const cr = S.create; const name = cr.name;
    if (/^[\s　]|[\s　]$/.test(name)){ cr.err = 'errTrim'; return render(); }
    cr.loading = true; render();
    setTimeout(() => {
      cr.loading = false;
      const taken = S.groups.some(g => g.name.zh === name || g.name.en.toLowerCase() === name.toLowerCase());
      if (taken){ cr.err = 'errDup'; render(); return; }
      replaceTop('createDone');
    }, 800);
  },
  createStart:() => go('createAvatar'),
  createLater:() => finishCreate(true),
  createGo:d => go(d.to),
  avPreset:d => { S.create.av = +d.i; S.create.avatarCustom = null; render(); },
  cvPreset:d => { S.create.cv = +d.i; S.create.coverCustom = null; render(); },
  camSheet:d => {
    S.fileTarget = d.target;
    openSheet(`<div class="list"><button class="srow" data-a="filePick" data-src="file"><span class="si">${I.image}</span><span class="grow-1">${t('pickPhoto')}</span></button>
      <button class="srow" data-a="filePick" data-src="cam"><span class="si">${I.camera}</span><span class="grow-1">${t('takePhoto')}</span></button>
      <button class="srow cancel" data-a="closeSheet">${t('cancel')}</button></div>`);
  },
  filePick:d => { closeSheet(); const el = d.src === 'cam' ? $('#camIn') : $('#fileIn'); el.multiple = false; el.click(); },
  createFinish:() => { S.create.loading = true; render(); setTimeout(() => finishCreate(false), 700); }
};
function finishCreate(later){
  const cr = S.create;
  const g = { id:nid('g'), name:{zh:cr.name, en:cr.name}, cat:cr.cat, priv:false, members:1, joined:true, pending:false, admin:'me', year:new Date().getFullYear(),
    cover: later ? CV_PRESETS[0].src : createCover(), avatar: later ? AV_PRESETS[0].src : createAvatar(), intro: later ? '' : {zh:cr.intro, en:cr.intro}, posts:[] };
  S.groups.unshift(g); S.create = null;
  S.stack = [{s:'explore'}, {s:'lobby', gid:g.id}];
  render({anim:true});
  setTimeout(() => A.invite({gid:g.id}), 260);
}

/* delegation */
document.addEventListener('click', e => {
  const rk = e.target.closest('[data-rk]');
  if (rk && e.detail === 0){ tapReact(rk.dataset.rk); return; }
  if (rk) return;
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn({...el.dataset}); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closePicker(); closeSheet(); }
  const el = e.target.closest && e.target.closest('[role="button"][data-a]');
  if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); A[el.dataset.a]({...el.dataset}); }
  if (e.target.id === 'cmtIn' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); A.sendComment(); }
});
function syncSend(){ const i = $('#cmtIn'), b = $('#sendBtn'); if (i && b) b.disabled = !i.value.trim(); }
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cmtIn'){ syncSend(); if (el.value.length >= 5000) toast(t('limitText')); }
  if (el.id === 'cmpTa'){
    S.compose.text = el.value;
    $('#cmpCnt').textContent = el.value.length.toLocaleString('en-US') + ' / 5,000';
    $('#pubBtn').disabled = !(el.value.trim() || S.compose.media.length);
    if (el.value.length >= 5000) toast(t('limitText'));
  }
  if (el.id === 'introTa'){ S.create.intro = el.value; $('#introCnt').textContent = el.value.length.toLocaleString('en-US') + ' / 5,000'; if (el.value.length >= 5000) toast(t('introLimit')); }
  if (el.id === 'cName'){
    let v = el.value;
    if (v.length && !v.replace(/[\s　]/g,'')){ v = ''; el.value = ''; }
    const cr = S.create; cr.name = v;
    cr.err = /^[\s　]|[\s　]$/.test(v) && v.length ? 'errTrim' : null;
    $('#cNameC').textContent = v.length + '/15';
    $('#cErr').textContent = cr.err ? t(cr.err) : '';
    el.parentElement.classList.toggle('err', !!cr.err);
    $('#cBtn').disabled = !(v.length && !cr.err && cr.cat);
  }
});
document.addEventListener('beforeinput', e => {
  const el = e.target;
  if ((el.id === 'cmpTa' || el.id === 'cmtIn') && el.value.length >= 5000 && e.inputType && e.inputType.startsWith('insert')) toast(t('limitText'));
});
function readFiles(files){
  const list = [...files].filter(f => /image\/(jpeg|png|gif)/.test(f.type) || f.type.startsWith('image/'));
  return Promise.all(list.map(f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); })));
}
['#fileIn','#camIn'].forEach(sel => $(sel).addEventListener('change', async e => {
  const urls = await readFiles(e.target.files); e.target.value = ''; e.target.multiple = true;
  if (!urls.length) return;
  if (S.fileTarget === 'compose' && S.compose){
    const room = 20 - S.compose.media.length; S.compose.media.push(...urls.slice(0, room));
    if (urls.length > room) toast(t('limitMedia'));
  } else if (S.fileTarget === 'avatar') S.create.avatarCustom = urls[0];
  else if (S.fileTarget === 'cover') S.create.coverCustom = urls[0];
  render();
}));

/* ================= fit phone to stage ================= */
function fit(){
  const head = document.documentElement.classList.contains('embedded') ? 0 : ($('#phHead') ? $('#phHead').offsetHeight : 0);
  const w = innerWidth, h = innerHeight - head, F = 18;
  let s;
  if (w <= 900) s = Math.min(1, (w - 40) / (390 + F), (h * 0.92) / (844 + F));
  else s = Math.min(1, (h - 48) / (844 + F));
  s = Math.max(.5, s);
  S.scale = s;
  const ph = $('#phone'); ph.style.transform = `scale(${s})`; ph.style.top = 9*s + 'px'; ph.style.left = 9*s + 'px';
  const f = $('#fit'); f.style.width = (390 + F) * s + 'px'; f.style.height = (844 + F) * s + 'px';
}
function setLang(v, save){
  S.lang = v === 'zh' ? 'zh' : 'en';
  if (save){ try { localStorage.setItem(SITE_LANG_KEY, S.lang); } catch(e){} }
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('.ph-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.lang)));
  render();
}
/* inside the case study page the site header is already there, so hide ours and follow its language */
try { if (window.self !== window.parent) document.documentElement.classList.add('embedded'); } catch(e){ document.documentElement.classList.add('embedded'); }
addEventListener('storage', e => { if (e.key === SITE_LANG_KEY && e.newValue) setLang(e.newValue, false); });
addEventListener('resize', fit);
fit();
setLang(S.lang, false);
</script>
