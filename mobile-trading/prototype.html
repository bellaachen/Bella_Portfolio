<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.ico" sizes="32x32"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><title>Global Trading App · Prototype | Bella Chen</title>
<style>.notes{display:none!important}.shell{grid-template-columns:230px minmax(400px,1fr)!important}</style>
<style>
:root{
  --bg:#f6f7f9;--paper:#fff;--ink:#1b2230;--ink2:#4a5568;--muted:#8a94a6;--line:#e7eaf0;--soft:#f2f4f8;
  --brand:#2a3fd6;--brand-soft:#eef0ff;--warn:#b7791f;--warn-soft:#fff8e6;--err:#c53030;--err-soft:#fff1f1;--ok-soft:#ecf8f1;
  --demo:#7a52cc;--demo-soft:#f3eefc;
  --up:#0f8a55;--down:#d13b3b;--up-soft:#e8f6ee;--down-soft:#fdecec;
}
body.tw{--up:#d13b3b;--down:#0f8a55;--up-soft:#fdecec;--down-soft:#e8f6ee}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:230px minmax(400px,1fr) 380px;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--paper);padding:22px 16px;position:sticky;top:0;z-index:60;height:100vh;overflow:auto}
.side h1{font-size:15px;margin:0 0 2px;letter-spacing:.01em}
.side .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.side .grp{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:16px 6px 6px}
.side button.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink2)}
.side button.nav:hover{background:var(--soft)}
.side button.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 18px 8px;min-height:100vh;position:sticky;top:0;height:100vh}
.scn{position:relative;margin:0 0 8px;z-index:50}
.scn-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;text-align:left}
.scn.open .scn-btn{border-color:var(--brand);background:var(--brand-soft)}
.scn-btn:hover{border-color:#cfd5e2}
.scn-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.scn-sum{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-arr{width:16px;height:16px;color:var(--ink2);transition:transform .2s;flex:none}
.scn.open .scn-arr{transform:rotate(180deg)}
.scn .controls{width:max-content;max-width:calc(100vw - 260px);display:none;position:fixed;z-index:100;box-shadow:0 14px 40px rgba(20,30,50,.16)}
.scn.open .controls{display:grid}
.controls{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;min-width:430px}
.controls .ttl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.ctl-l{font-size:12px;color:var(--ink2);white-space:nowrap}
.controls .seg{justify-self:start}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{white-space:nowrap;border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.notes{border-left:1px solid var(--line);background:var(--paper);padding:24px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.notes .eyebrow{font-size:11px;letter-spacing:.1em;color:var(--brand);font-weight:700;text-transform:uppercase}
.notes h2{font-size:19px;margin:4px 0 6px}
.notes p.lead{color:var(--ink2);margin:0 0 14px;font-size:13px}
.notes h3{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:18px 0 6px;text-transform:uppercase}
.notes ul{margin:0;padding-left:18px}.notes li{margin:4px 0;font-size:13px;color:var(--ink2)}
.ref{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin:4px 0;color:var(--ink2)}
.ref code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--ink);white-space:nowrap}
.fix{font-size:12.5px;background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0;color:var(--ink2)}
.fix b{color:var(--ink)}
.try li{list-style:none;margin-left:-18px}
.try li:before{content:"→ ";color:var(--brand)}
.foot{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
@media(max-width:1180px){.shell{grid-template-columns:1fr}.center{position:relative!important;height:auto!important;min-height:0!important}.side,.notes{position:relative;height:auto;border:0}.side{order:1}.center{order:2}.notes{order:3}}
/* ---------- phone ---------- */
.phone{width:390px;height:812px;background:#111;border-radius:52px;padding:11px;box-shadow:0 30px 60px rgba(20,30,50,.18)}
.screen{position:relative;width:100%;height:100%;background:var(--paper);border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:13px;font-weight:600}
.status .isl{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:110px;height:30px;background:#111;border-radius:20px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);padding:6px 0 22px;background:var(--paper)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;white-space:nowrap;color:var(--muted)}
.tabbar button.on{color:var(--brand);font-weight:600}
.tabbar svg{width:22px;height:22px}
.hdr{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;min-height:44px}
.hdr .t{flex:1;text-align:center;font-weight:600;font-size:15px}
.hdr .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.ib{border:0;background:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.ib:hover{background:var(--soft)}.ib svg{width:20px;height:20px}
.acct{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px 5px 12px;font-size:12.5px;font-weight:600}
.acct svg{width:14px;height:14px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:5px;padding:1px 6px;vertical-align:1px}
.b-demo{background:var(--demo-soft);color:var(--demo)}.b-live{background:var(--ok-soft);color:#16794a}.b-copy{background:#e9f3ff;color:#245fae}
.b-warn{background:var(--warn-soft);color:var(--warn)}.b-mute{background:var(--soft);color:var(--ink2)}.b-err{background:var(--err-soft);color:var(--err)}
.modebar{margin:0 16px 10px;border-radius:10px;padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.modebar.demo{background:var(--demo-soft);color:var(--demo)}
.modebar.copy{background:#e9f3ff;color:#245fae}
.modebar svg{width:15px;height:15px;flex:none}
.sec{padding:4px 16px 14px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px}
.sec-t b{font-size:15px}.sec-t a{font-size:12px;color:var(--brand);text-decoration:none;cursor:pointer}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--ink2)}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:600;font-size:14.5px;width:100%}
.btn.pri{background:var(--brand);color:#fff}.btn.sec2{background:var(--soft);color:var(--ink)}
.btn.out{background:var(--paper);border:1px solid var(--line)}
.btn.buy{background:var(--up);color:#fff}.btn.sell{background:var(--down);color:#fff}
.btn.danger{background:var(--err-soft);color:var(--err)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chip.off{color:var(--muted);background:var(--soft);border-style:dashed}
.segc{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin:0 16px 12px}
.segc button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13px;color:var(--ink2)}
.segc button.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink);font-weight:600}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.li:hover{background:#fafbfc}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--soft);color:var(--ink2)}
.sym{font-weight:600;font-size:14px}
.px{font-weight:600;font-size:14px;text-align:right}
.chg{font-size:11.5px;text-align:right;border-radius:5px;padding:1px 6px;display:inline-block;min-width:58px}
.chg.up{background:var(--up-soft)}.chg.down{background:var(--down-soft)}
.stale .px,.stale [data-live]{color:var(--muted)!important}
.msg{border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0;display:flex;gap:8px;white-space:pre-line}
.msg svg{width:16px;height:16px;flex:none;margin-top:1px}
.msg.err{background:var(--err-soft);color:var(--err)}.msg.warn{background:var(--warn-soft);color:#8a5a12}.msg.info{background:var(--brand-soft);color:#2a3a9e}
.field{margin:12px 0}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:5px}
.stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--soft);width:44px;font-size:18px}
.stepper input,.inp{flex:1;border:0;padding:10px 12px;font-size:15px;font-weight:600;text-align:center;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.inp{border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;font-weight:500}
.inp:focus,.stepper:focus-within{border-color:var(--brand)}
.ferr{color:var(--err);font-size:11.5px;margin-top:4px}
.sticky{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px 12px;z-index:2}
.tradebar{display:flex;gap:8px;align-items:stretch}
.tradebar .btn{padding:8px 10px;line-height:1.2}
.tradebar .btn small{display:block;font-weight:500;font-size:11px;opacity:.9}
.spr{display:grid;place-items:center;font-size:11px;color:var(--muted);min-width:42px;text-align:center}
.skel{background:linear-gradient(90deg,#eef1f5 25%,#f7f8fa 37%,#eef1f5 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:6px;height:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{text-align:center;padding:36px 24px;color:var(--ink2)}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty .ic svg{width:24px;height:24px}
.tile{background:#f7f8fa;border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--ink2)}
.tile b{display:block;font-size:16px;color:var(--ink);font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.eqchip{background:#eceef2;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink2);font-weight:600}
.sethero{background:linear-gradient(180deg,#d6dcfb 0%,#e9ecfd 45%,#f8f8fa 100%);padding:22px 20px 22px;text-align:center}
.screen.grad .status{background:#d6dcfb}
.setav{width:76px;height:76px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 50% 35%,#2e3f9a,#141d52);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;letter-spacing:.04em;box-shadow:0 6px 16px rgba(20,29,82,.25)}
.actpill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--ink2);margin-top:8px}
.actpill i{width:8px;height:8px;border-radius:50%}
.swbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:#eceffd;color:var(--brand);border-radius:999px;padding:7px 14px;font-size:13.5px;margin-top:10px}
.swbtn svg{width:16px;height:16px}
.setbody{background:#f8f8fa;padding:4px 16px 0;min-height:100%}
.sg-t{font-size:15px;font-weight:600;color:var(--ink2);margin:18px 2px 8px}
.sg{background:var(--paper);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sg .li{padding:15px 16px}.sg .li:last-child{border-bottom:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.qa{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);padding:4px 0}
.qa span.i{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--brand)}
.qa span.i svg{width:21px;height:21px}
.qa:first-child span.i{background:var(--brand);color:#fff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.metrics div{font-size:11.5px;color:var(--muted)}.metrics b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.dot.done{background:var(--ok-soft);color:#16794a}.dot.todo{border:1.5px solid var(--line);color:var(--muted)}.dot.now{background:var(--brand);color:#fff}
.news{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.thumb{width:64px;height:48px;border-radius:8px;flex:none;background:linear-gradient(135deg,#dfe6f5,#f1f3f9)}
canvas{display:block;width:100%}
.tf{display:flex;gap:4px;align-items:center;padding:4px 16px}
.tf button{border:0;background:none;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--muted)}
.tf button.on{background:var(--soft);color:var(--ink);font-weight:600}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:12.5px}
.statgrid div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.statgrid span{color:var(--muted)}
.tip{border:0;background:none;padding:0 0 0 4px;color:var(--muted);vertical-align:-3px}
.tip svg{width:14px;height:14px}
.expl{font-size:11.5px;color:var(--ink2);background:var(--soft);border-radius:8px;padding:8px 10px;margin:-2px 0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill.open{background:var(--ok-soft);color:#16794a}.pill.open i{background:#16a05a}
.pill.closed{background:var(--soft);color:var(--ink2)}.pill.closed i{background:#a0a8b8}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(15,20,30,.38);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:8px 18px 28px;max-height:86%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet.noanim{animation:none}
.grab{width:38px;height:4px;border-radius:4px;background:#d9dde5;margin:4px auto 12px}
.sheet h4{margin:0 0 4px;font-size:17px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid #c9cfda;flex:none}
.radio.on{border:5px solid var(--brand)}
.center-dlg{position:absolute;inset:0;z-index:30;background:rgba(15,20,30,.45);display:grid;place-items:center;padding:28px}
.dlg{background:var(--paper);border-radius:18px;padding:22px;text-align:center;width:100%}
.dlg .big{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px}
.dlg .big svg{width:26px;height:26px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1b2230;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;animation:up .2s}
.toast a{color:#9fb0ff;font-weight:600;cursor:pointer}
.netbar{background:#2d3443;color:#fff;font-size:12px;padding:6px 14px;display:flex;gap:8px;align-items:center;flex:none}
.netbar svg{width:14px;height:14px}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28)}
.hold.holding i{width:100%;transition:width 1s linear}
.toggle{width:44px;height:26px;border-radius:999px;background:#d4d9e2;position:relative;border:0;flex:none;transition:.2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--brand)}.toggle.on:after{left:21px}
.setgrp{margin:6px 16px 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.setgrp .li{padding:12px 14px}
.setgrp .li:last-child{border-bottom:0}
.grp-t{font-size:11.5px;color:var(--muted);margin:14px 20px 0;letter-spacing:.04em}
.ext{font-size:11px;color:var(--muted)}
.chev{color:#b3bac8;width:16px;height:16px;flex:none}
.sigcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.sigcard:hover{border-color:#cfd5e2}
.risk{display:inline-flex;gap:2px;vertical-align:middle}
.risk i{width:5px;height:12px;border-radius:2px;background:#e3e7ee}
.risk i.f{background:#e0a23b}.risk.lo i.f{background:#27a86a}.risk.hi i.f{background:#d64545}
.mode{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px}
.mode.on{border-color:var(--brand);background:var(--brand-soft)}
.mode b{font-size:13.5px}.mode p{margin:2px 0 0;font-size:11.5px;color:var(--ink2)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink2);cursor:pointer;margin:12px 0}
.cb{width:18px;height:18px;border-radius:5px;border:2px solid #c9cfda;flex:none;display:grid;place-items:center;margin-top:1px}
.cb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cb svg{width:12px;height:12px}
.flabel{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center}
.dd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f4f5f8;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px}

function ptStep(s){const sp=SY[s];return Math.pow(10,-sp.dig)*(sp.dig>=3?10:1)}
function validate(){const o=S.ord,s=o.sym,sp=SY[s],a=A(),st=stats(a);const v=[];const f={};
 if(S.market==='closed')v.push(['err','Market is closed. Orders can only be placed or modified during trading hours.\nMarket opens in '+cd()]);
 else if(a.access==='close')v.push(['err','Account Status: Close Only\nThis copier account can close or modify positions but cannot open new orders.']);
 else if(!sp.types.includes(o.type))v.push(['err',`${TYPE_N[o.type]} orders are not acceptable for this instrument`]);
 else if(sp.dir==='no')v.push(['err','This Instrument Is Non-Tradable']);
 else if(sp.dir==='close')v.push(['err','New Positions Are Not Accepted For This Instrument']);
 else if(sp.dir==='long'&&o.side==='sell')v.push(['err','Only Buy Orders Are Accepted For This Instrument']);
 else if(sp.dir==='short'&&o.side==='buy')v.push(['err','Only Sell Orders Are Accepted For This Instrument']);
 const mkt=o.side==='buy'?ask(s):P[s].bid;let px=mkt;
 if(o.type!=='market'){px=+o.price;
  if(!o.price||isNaN(px))f.price='Enter a price';
  else if(o.type==='limit'&&o.side==='buy'&&px>=mkt)f.price='Buy limit must be below the current ask ('+fmt(mkt,sp.dig)+')';
  else if(o.type==='limit'&&o.side==='sell'&&px<=mkt)f.price='Sell limit must be above the current bid ('+fmt(mkt,sp.dig)+')';
  else if((o.type==='stop'||o.type==='stoplimit')&&o.side==='buy'&&px<=mkt)f.price='Buy stop must be above the current ask ('+fmt(mkt,sp.dig)+')';
  else if((o.type==='stop'||o.type==='stoplimit')&&o.side==='sell'&&px>=mkt)f.price='Sell stop must be below the current bid ('+fmt(mkt,sp.dig)+')';}
 if(!(o.vol>=sp.min-1e-9))f.vol=`Minimum ${fmt(sp.min*sp.cs,sp.min*sp.cs<1?1:0)} units`;
 if(o.slT!=='none'){const x=+o.sl;if(!o.sl)f.sl='Enter a stop loss price';else if(o.side==='buy'&&x>=px)f.sl='Stop loss must be below the entry price';else if(o.side==='sell'&&x<=px)f.sl='Stop loss must be above the entry price';else if(o.slT==='gsl'&&Math.abs(px-x)/Math.pow(10,-sp.dig)<30)f.sl='Guaranteed stop must be at least 30 points away'}
 if(o.tpT!=='none'){const x=+o.tp;if(!o.tp)f.tp='Enter a take profit price';else if(o.side==='buy'&&x<=px)f.tp='Take profit must be above the entry price';else if(o.side==='sell'&&x>=px)f.tp='Take profit must be below the entry price'}
 const m=marginOf(s,o.vol||0,px||mkt);const val=(s.startsWith('USD')?(o.vol||0)*sp.cs:(o.vol||0)*sp.cs*(px||mkt));
 if(!v.length&&m>st.free)v.push(['err',`Insufficient free margin.\nRequired ${money(m)} · available ${money(st.free)}`]);
 return {v,f,m,val,px,st,ok:!v.length&&!Object.keys(f).length};
}

function legCalc(r,key,typ){const o=S.ord,s=o.sym,sp=SY[s];const x=+o[key];if(!o[key]||isNaN(x))return '';
 const pts=Math.abs(r.px-x)/Math.pow(10,-sp.dig);let usd=Math.abs(r.px-x)*o.vol*sp.cs;if(s.endsWith('JPY'))usd/=x;const loss=key==='sl';
 const prem=typ==='gsl'||typ==='gtp'?o.vol*sp.cs*r.px*0.0002/(s.endsWith('JPY')?r.px:1):0;
 return `<div class="tr num"><span>Point</span><b>${fmt(pts,0)}</b></div><div class="tr num"><span>USD</span><b class="${loss?'down':'up'}">${loss?'-':'+'}${fmt(usd)}</b></div>${typ==='tob'?'<div class="tr num"><span>TOB Premium</span><b>0.00</b></div>':''}${typ==='gsl'||typ==='gtp'?`<div class="tr num"><span>Guaranteed Premium</span><b>${fmt(prem)}</b></div>`:''}`}

 const pad=54;const hi=Math.max(...CAND.map(c=>c.h)),lo=Math.min(...CAND.map(c=>c.l));const y=v=>8+(hi-v)/(hi-lo||1)*(H-24);const cw=(W-pad-12)/CAND.length;
 x.strokeStyle='#eef0f4';x.fillStyle='#9aa3b2';x.font='10px -apple-system,sans-serif';x.lineWidth=1;
 for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;const yy=y(v);x.beginPath();x.moveTo(12,yy);x.lineTo(W-pad,yy);x.stroke();x.fillText(fmt(v,SY[S.sym].dig),W-pad+4,yy+3)}

 if(S.ctype==='line'){x.beginPath();CAND.forEach((c,i)=>{const xx=12+i*cw+cw/2;i?x.lineTo(xx,y(c.c)):x.moveTo(xx,y(c.c))});x.strokeStyle='#2a3fd6';x.lineWidth=1.8;x.stroke();
  x.lineTo(12+(CAND.length-1)*cw+cw/2,H);x.lineTo(12+cw/2,H);x.closePath();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(42,63,214,.14)');g.addColorStop(1,'rgba(42,63,214,0)');x.fillStyle=g;x.fill()}
 else CAND.forEach((c,i)=>{const xx=12+i*cw;const col=c.c>=c.o?up:dn;x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(xx+cw/2,y(c.h));x.lineTo(xx+cw/2,y(c.l));x.stroke();const t=y(Math.max(c.o,c.c)),b=y(Math.min(c.o,c.c));x.fillRect(xx+cw*.18,t,cw*.64,Math.max(1,b-t))});
 const last=CAND[CAND.length-1].c,ly=y(last);x.setLineDash([3,3]);x.strokeStyle='#2a3fd6';x.beginPath();x.moveTo(12,ly);x.lineTo(W-pad,ly);x.stroke();x.setLineDash([]);

function drawEq(){const cv=document.getElementById('eqc');if(!cv)return;const x0=SIG.find(s=>s.id===S.sig);const r=x0.ret[S.sigPer];const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=120;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 let seed=x0.id.charCodeAt(0)+S.sigPer.length;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const n=40;let v=100;const pts=[];for(let i=0;i<n;i++){v+= (r/n)+(rnd()-.5)*x0.mdd/6;pts.push(v)}

 if(k==='bid'){t=fmt(P[a].bid,SY[a].dig)}else if(k==='ask'){t=fmt(ask(a),SY[a].dig)}
 else if(k==='chg'){const v=(P[a].bid-P[a].open)/P[a].open*100;t=(v>0?'+':'')+fmt(v,2)+'%';el.className='chg num '+cls(v)}
 else if(k==='chgp'){const v=(P[a].bid-P[a].open)/P[a].open*100;t=(v>0?'+':'')+fmt(v,2)+'%';el.classList.remove('up','down');if(cls(v))el.classList.add(cls(v))}
 else if(k==='chgabs'){const v=(P[a].bid-P[a].open)/P[a].open*100;el.innerHTML=`<span class="${cls(v)}">${v>0?'+':''}${fmt(P[a].bid-P[a].open,SY[a].dig)} (${v>0?'+':''}${fmt(v,2)}%)</span>`;return}
 else if(k==='pnl'){const p=Object.values(ACC).flatMap(x=>x.pos).find(x=>x.id===a);if(!p)return;const v=pnl(p);t=money(v,true);el.classList.remove('up','down');if(cls(v))el.classList.add(cls(v))}
 else if(k==='acc'){const s=stats(A());if(a==='eq')t=money(s.eq);if(a==='free')t=money(s.free);if(a==='lvl')t=s.level?fmt(s.level,0)+'%':'—';if(a==='freen')t=fmt(s.free);if(a==='eqn')t=fmt(s.eq);if(a==='upchip'){t=upChip(s);el.classList.remove('up','down');if(cls(s.up))el.classList.add(cls(s.up))}if(a==='up'){t=money(s.up,true);el.classList.remove('up','down');if(cls(s.up))el.classList.add(cls(s.up))}}
 else if(k==='cd'){t=cd()}
 if(t!==undefined&&el.textContent!==t)el.textContent=t});
 if(cur()==='symbol')drawChart();
 if(cur()==='ticket'&&!document.activeElement.matches('input'))refreshTicket();}
setInterval(()=>{
 if(S.sys!=='offline'&&S.sys!=='maint'&&S.market==='open'){for(const k in P){const sp=SY[k];const d=(Math.random()-.5)*P[k].bid*.00035;P[k].bid=Math.max(sp.px*.9,P[k].bid+d);P[k].hi=Math.max(P[k].hi,P[k].bid);P[k].lo=Math.min(P[k].lo,P[k].bid)}
  if(CAND.length&&candSym===S.sym+S.tf){const c=CAND[CAND.length-1];c.c=P[S.sym].bid;c.h=Math.max(c.h,c.c);c.l=Math.min(c.l,c.c);if(++tickN%8===0){CAND.shift();CAND.push({o:c.c,h:c.c,l:c.c,c:c.c})}}}
 updateLive();
},1000);

function fitPhone(){const ph=document.querySelector('.phone');const avail=innerHeight-16-8-46;const z=Math.min(1,Math.max(.55,avail/834));ph.style.zoom=z}
addEventListener('resize',()=>{fitPhone();if(cur()==='symbol')drawChart()});fitPhone();
render();
</script>
