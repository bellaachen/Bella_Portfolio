<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  html[lang="zh-Hant"] body{font-family:var(--sans),var(--zh)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 var(--gutter)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-top:32px}
  .kicker{font-size:12px;letter-spacing:.2em;color:var(--brand);text-transform:uppercase}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:6px 0 8px}
  html[lang="zh-Hant"] h1{font-weight:600;letter-spacing:0}
  .intro{margin:0;color:var(--ink-secondary);max-width:660px}
  .lang{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-pill);overflow:hidden;flex:none}
  .lang button{font:inherit;font-size:13px;background:none;border:0;padding:6px 14px;min-height:36px;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .grid{display:grid;grid-template-columns:330px 1fr;gap:28px;margin-top:28px;align-items:start}
  .grid > *{min-width:0}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px}
  .panel h2,.list h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;margin:0 0 14px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{border:1px solid var(--border-strong);background:var(--surface-raised);border-radius:var(--radius-pill);padding:5px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .field{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
  .field:first-child{border-top:none}
  .field label{font-size:14px}
  .field small{display:block;color:var(--ink-muted);font-size:12px;line-height:1.4}
  .field input{width:100%;font:inherit;text-align:right;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
  .field input:focus{outline:2px solid var(--brand-tint);border-color:var(--brand)}
  .total{display:flex;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:1px solid var(--border);font-weight:500}
  .toggle{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px;background:var(--brand-tint);border-radius:var(--radius-md);cursor:pointer;font-size:13px;color:var(--ink-secondary)}
  .toggle b{color:var(--ink)}
  .toggle input{margin-top:4px;accent-color:var(--brand)}
  .num{font-variant-numeric:tabular-nums}
  .hero{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
  .hero .label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:600}
  .hero .name{font-family:var(--serif);font-size:26px;font-weight:500;margin:4px 0}
  html[lang="zh-Hant"] .hero .name{font-weight:600}
  .hero .bank{color:var(--ink-muted);font-size:13px}
  .hero .amount{font-family:var(--serif);font-size:40px;color:var(--brand);margin-top:10px;line-height:1.1}
  .hero .amount span{font-family:var(--sans);font-size:14px;color:var(--ink-muted);margin-left:6px}
  .hero .why{margin-top:8px;font-size:14px;color:var(--ink-secondary)}
  .combo{margin-top:12px;background:var(--surface-raised);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:14px 20px;font-size:14px;color:var(--ink-secondary)}
  .combo b{color:var(--brand)}
  .list{margin-top:22px}
  details.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px}
  details.card summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 18px}
  details.card summary::-webkit-details-marker{display:none}
  .rank{font-size:13px;color:var(--ink-muted)}
  .cname{font-weight:500}
  .cname small{display:block;color:var(--ink-muted);font-size:12px;font-weight:400}
  .cval{text-align:right}
  .cval b{font-size:17px;font-weight:600}
  .cval small{display:block;color:var(--ink-muted);font-size:12px}
  .bar{grid-column:2 / 4;height:4px;background:var(--surface-muted);border-radius:2px;overflow:hidden;margin-top:-4px}
  .bar i{display:block;height:100%;background:var(--brand);opacity:.75}
  .body{padding:4px 18px 16px;border-top:1px solid var(--border)}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;min-width:520px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{font-weight:500;color:var(--ink-muted);font-size:12px}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:var(--radius-xs);margin:2px 4px 0 0;line-height:1.6;background:var(--surface-muted);color:var(--ink-secondary)}
  .tag.cond{background:var(--brand-tint);color:var(--brand)}
  .tag.cap,.tag.warn{background:var(--ink);color:var(--surface)}
  .meta{font-size:12px;color:var(--ink-muted);margin-top:10px}
  .meta.warn{color:var(--ink)}
  .notes{margin-top:40px;font-size:13px;color:var(--ink-muted)}
  .notes h3{font-size:13px;color:var(--ink);margin:18px 0 6px;font-weight:600}
  .notes ul{margin:0;padding-left:18px}
  .notes a{color:var(--brand)}
  footer{max-width:1120px;margin:40px auto 0;padding:20px var(--gutter) 36px;color:var(--ink-subtle);font-size:12px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker" data-i="kicker"></div>
      <h1 data-i="title"></h1>
      <p class="intro" data-i="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>

  <div class="grid">
    <section class="panel">
      <h2 data-i="spendTitle"></h2>
      <div class="presets" id="presets"></div>
      <div id="fields"></div>
      <div class="total"><span data-i="monthlyTotal"></span><span class="num" id="total"></span></div>
      <label class="toggle"><input type="checkbox" id="condMode"><span><b data-i="toggleTitle"></b><br><span data-i="toggleText"></span></span></label>
    </section>
    <section>
      <div class="hero" id="hero"></div>
      <div class="combo" id="combo"></div>
      <div class="list"><h2 data-i="ranking"></h2><div id="list"></div></div>
    </section>
  </div>

  <div class="notes" id="notes"></div>
</div>
<footer>Bella Chen</footer>

<script>
const SITE_LANG_KEY = 'bella-portfolio-language';
let lang = (() => { try { return localStorage.getItem(SITE_LANG_KEY) === 'zh' ? 'zh' : 'en'; } catch(e){ return 'en'; } })();
const T = v => Array.isArray(v) ? v[lang === 'zh' ? 1 : 0] : v;

const UI = {
  kicker:['Prototype · 2026 rebuild','原型 · 2026 重建版'],
  title:['Credit card reward recommender','信用卡回饋推薦器'],
  intro:['Enter roughly what you spend each month. Each card\'s rules — bonus channels, caps, thresholds and sign-up conditions — turn that into what you would actually get back, with every number explained.','填入每個月大概花在哪裡，系統依各卡的回饋規則（加碼、上限、門檻、登錄條件）算出實際能拿多少，並說明每一筆是怎麼算的。'],
  spendTitle:['Monthly spending (NT$)','每月消費（新台幣）'],
  monthlyTotal:['Monthly total','每月合計'],
  toggleTitle:['Include "up to" rewards','把「最高回饋」也算進來'],
  toggleText:['Bonuses that need registration, a linked wallet, a plan switch or a task. Unticked, only rewards you get without doing anything are counted.','需要登錄、綁定支付、切換方案或完成任務的加碼。不勾選時，只算不用做任何事就拿得到的回饋。'],
  ranking:['All cards, ranked','所有卡片排名'],
};

const CATS = [
  {id:'general',  name:['General','一般消費'],        hint:['Groceries, daily items, other local spend','超市、日用品、其他國內刷卡'], domestic:true},
  {id:'dining',   name:['Dining','餐飲'],             hint:['Eating out, restaurants','外食、餐廳'], domestic:true},
  {id:'online',   name:['Online shopping','國內網購'], hint:['momo, Shopee and similar','momo、蝦皮等'], domestic:true},
  {id:'mobile',   name:['Mobile wallets','行動支付'],  hint:['LINE Pay, JKOPAY, Taishin Pay','LINE Pay、街口、台新Pay 等'], domestic:true},
  {id:'transit',  name:['Transport','交通'],           hint:['High-speed rail, railway, taxis','高鐵、台鐵、計程車'], domestic:true},
  {id:'subs',     name:['Subscriptions','數位訂閱'],   hint:['Streaming, AI tools, games','串流、AI 工具、遊戲'], domestic:true},
  {id:'overseas', name:['Overseas','海外消費'],        hint:['Including overseas online','含海外網購'], domestic:false},
  {id:'insurance',name:['Insurance','保費'],           hint:['Life and property premiums','壽險、產險'], domestic:false},
];

const PRESETS = [
  {name:['Eats out','外食族'],      v:{general:3000,dining:8000,online:5000}},
  {name:['Shops online','網購族'],  v:{general:3000,dining:4000,online:12000,mobile:2000,subs:600}},
  {name:['Travels','常出國'],       v:{general:5000,dining:5000,online:3000,overseas:15000}},
  {name:['Commutes','通勤族'],      v:{general:4000,dining:5000,transit:3000,mobile:3000}},
  {name:['Pays premiums','繳保費月'],v:{general:3000,dining:5000,insurance:40000}},
];

const STATED = ['Page says "up to"','頁面寫「最高」'];
const TASK2X = ['Complete the doubling task','完成加倍任務'];

// Rules from Money101 (updated 2026/11/05) and Mr.Market / rich01 (updated 2026/10/13). Rates in %.
const CARDS = [
  {bank:['HSBC','滙豐銀行'], name:['Cash Back Premier','現金回饋御璽卡'], fee:['Annual fee NT$2,000, first year free','年費 NT$2,000，首年免'],
   rules:{general:{base:1.22}, overseas:{base:2.22, note:['Excludes in-store spend in the EU and UK','歐盟、英國實體消費除外']}, insurance:{base:1.22, note:['Premiums 1.22%, no cap or conditions','保費 1.22% 無上限、無限制條件']}},
   note:['1.22% local and 2.22% overseas, no cap, no conditions; premiums also earn 1.22%.','國內 1.22%、海外 2.22% 無上限，沒有門檻；保費也有 1.22%。']},
  {bank:['HSBC','滙豐銀行'], name:['Live+ Cash Back','Live+現金回饋卡'], fee:['Annual fee NT$2,000, first year free','年費 NT$2,000，首年免'],
   rules:{general:{base:0.88},
          dining:{base:0.88, cond:{rate:3.88, note:['Dining bonus; '+STATED[0],'餐飲加碼，'+STATED[1]]}},
          online:{base:0.88, cond:{rate:3.88, note:['Shopping bonus; '+STATED[0],'購物加碼，'+STATED[1]]}},
          overseas:{base:0.88, note:['Dining in selected Asian countries up to 5.88%, not modelled separately','指定亞洲國家餐飲最高 5.88%，此處未分開試算']}},
   note:['0.88% on everything, no cap; dining, shopping and entertainment up to 3.88%.','一般消費 0.88% 無上限；餐飲、購物、娛樂最高 3.88%。']},
  {bank:['HSBC','滙豐銀行'], name:['Diamond','匯鑽卡'], fee:['Annual fee NT$2,000, waived with e-statements','年費 NT$2,000，電子帳單免年費'],
   rules:{general:{base:1, cond:{rate:2, note:['Doubling task: 5,000 points and NT$300k with HSBC','加倍任務：5,000 點＋滙豐資產 NT$30 萬']}},
          online:{base:3, group:'ch', cond:{rate:6, note:TASK2X}},
          mobile:{base:3, group:'ch', cond:{rate:6, note:TASK2X}},
          subs:{base:3, group:'ch', cond:{rate:6, note:TASK2X}},
          overseas:{base:1, cond:{rate:6, note:TASK2X}},
          insurance:{base:1}},
   groups:{ch:{cap:2000, label:['Shared cap on selected channels NT$2,000','指定通路回饋上限 NT$2,000']}},
   note:['3% on selected channels (JKOPAY, games and streaming, online shopping), capped at NT$2,000 (period not stated; treated as monthly).','指定通路（街口、遊戲串流、網購等）3%，回饋上限 NT$2,000（頁面沒寫期間，以每月計）。']},
  {bank:['DBS','星展銀行'], name:['eco','eco永續卡'], fee:['Annual fee NT$3,000, first year free','年費 NT$3,000，首年免'],
   rules:{general:{base:1}, overseas:{base:1, cond:{rate:5, capBonus:600, note:['Selected mobile wallets in JP, KR, TH, SG, the Americas and Europe','在日韓泰新、美洲、歐洲用指定行動支付']}}},
   note:['1% local and overseas, no cap; selected overseas mobile payments up to 5%, bonus capped at 600 points.','國內外一般消費 1% 無上限；海外指定行動支付最高 5%，加碼上限 600 點。']},
  {bank:['Far Eastern','遠東商銀'], name:['Happy+','樂家+卡'], fee:['Annual fee NT$2,000, first year free','年費 NT$2,000，首年免'],
   rules:{general:{base:0.5},
          dining:{base:0.5, cond:{rate:4, note:['Dining bonus; '+STATED[0],'餐飲加碼，'+STATED[1]]}},
          overseas:{base:0.5, cond:{rate:2.5, note:['Overseas bonus; '+STATED[0],'海外加碼，'+STATED[1]]}},
          insurance:{base:null, cond:{rate:3, note:['Premium bonus; '+STATED[0],'保費加碼，'+STATED[1]]}}},
   note:['0.5% on everything, no cap; dining up to 4%, premiums up to 3%, overseas up to 2.5%.','一般消費 0.5% 無上限；餐飲最高 4%、保費最高 3%、海外最高 2.5%。']},
  {bank:['Far Eastern','遠東商銀'], name:['Ride','樂行卡'], fee:['Annual fee NT$2,000','年費 NT$2,000'],
   rules:{general:{base:1}, overseas:{base:2},
          transit:{base:1, cond:{rate:3, minTotal:3000, note:['Rail needs NT$3,000 spend that month and registration','高鐵、台鐵需當月刷滿 NT$3,000 並登錄']}}},
   note:['1% local, 2% overseas; transport (rail, taxis) up to 3%.','國內 1%、海外 2%；交通（高鐵、台鐵、計程車）最高 3%。']},
  {bank:['First Bank','第一銀行'], name:['iLEO','iLEO卡'], fee:['Annual fee NT$1,200, first year free','年費 NT$1,200，首年免'],
   rules:{overseas:{base:3}, mobile:{base:3},
          online:{base:2, cond:{rate:5, note:['Three NT$1,000+ payments a month unlock a bonus coupon','每月 3 筆滿 NT$1,000 解鎖加碼券']}},
          subs:{base:2, cond:{rate:7, note:['Three NT$1,000+ payments a month unlock a bonus coupon','每月 3 筆滿 NT$1,000 解鎖加碼券']}}},
   note:['3% overseas and on LINE Pay / JKOPAY; 2% on momo / Shopee and subscriptions, more with coupons. No general local rate stated.','海外、LINE Pay／街口 3%；momo／蝦皮 2%、數位訂閱 2%，用加碼券可再加。頁面沒寫國內一般消費回饋。']},
  {bank:['E.SUN','玉山銀行'], name:['U Bear','U Bear卡'], fee:['Annual fee NT$3,000','年費 NT$3,000'],
   rules:{general:{base:1}, overseas:{base:1},
          online:{base:1, cond:{rate:3, capBonus:150, note:['Online bonus 2%, needs e-statements and auto-debit; bonus capped at NT$150 a month','網購加碼 2%，需電子帳單＋帳戶自扣，加碼上限 NT$150／月']}},

   warn:['Money101 shows 11% online. Mr.Market breaks it down as 1% base + 2% online + 10% for new customers; this uses the 3% an existing customer gets.','Money101 寫網購 11%，市場先生拆開後是「基本 1%＋網購 2%＋新戶 10%」，這裡採用舊戶的 3%。']},
  {bank:['E.SUN','玉山銀行'], name:['Unicard','Unicard'], fee:['Annual fee NT$3,000 (waivers per bank site)','年費 NT$3,000（依官網減免）'],
   rules:{general:{base:1}, overseas:{base:1},
          transit:{base:1, cond:{rate:4.5, capBonus:5000, note:['Switch to the "UP" plan; rail is on the top-100 merchant list. Bonus capped at 5,000 points a month','切換「UP選」方案，高鐵／台鐵屬百大指定通路；加碼上限 5,000 點／月']}},
          mobile:{base:1, cond:{rate:4.5, capBonus:5000, note:['Switch to the "UP" plan; JKOPAY is on the top-100 list. Bonus capped at 5,000 points a month','切換「UP選」方案，街口等屬百大指定通路；加碼上限 5,000 點／月']}}},
   note:['1% base, no cap; 3.5% bonus at top-100 merchants (UP plan, capped at 5,000 points a month), with e-statements or auto-debit. Whether a restaurant or shop is on the list varies, so no bonus is counted for dining or online.','基本 1% 無上限；百大指定通路加碼 3.5%（UP選，上限 5,000 點／月），需電子帳單或帳戶自扣。餐飲、網購是否在百大名單內依店家而定，這裡不計入加碼。']},
  {bank:['SinoPac','永豐銀行'], name:['SPORT','SPORT卡'], fee:['Annual fee per bank site','年費依官網'],
   rules:{general:{base:1},
          mobile:{base:1, cond:{rate:5, capBonus:350, note:['Selected wallets 3% (cap NT$300) + exercise task 1% (cap NT$50), with auto-debit','指定行動支付 3%（上限 NT$300）＋運動任務 1%（上限 NT$50），需設自動扣繳']}}},
   note:['1% base, no cap; 3% bonus on selected wallets or channels (cap NT$300), plus 1% for exercise goals (cap NT$50). No overseas rate stated.','基本 1% 無上限；指定支付或通路加碼 3%（上限 NT$300），達成運動任務再加 1%（上限 NT$50）。頁面沒寫海外回饋。']},
  {bank:['O-Bank','王道銀行'], name:['O! Range','O! Range卡'], fee:['Annual fee per bank site','年費依官網'],
   rules:{general:{base:1},
          mobile:{base:1, cond:{rate:6, capBonus:500, note:['Selected wallets +5% (cap NT$500 a month); limited monthly registration, NT$300+ per payment','指定支付加碼 5%（上限 NT$500／月），每月限量登錄、單筆滿 NT$300']}},
          overseas:{base:null, cond:{rate:6, note:['Limited registration, selected countries; '+STATED[0],'限量登錄、指定國家，'+STATED[1]]}}},
   note:['1% base, no cap; +5% on selected mobile wallets (cap NT$500 a month). Shopee / momo up to 10.88% and Taipei Metro 11% carry more conditions and are not counted.','基本 1% 無上限；指定行動支付加碼 5%（上限 NT$500／月）。蝦皮／momo 最高 10.88%、北捷 11% 等活動條件較多，這裡不計入。']},
  {bank:['Taishin','台新銀行'], name:['Richart','Richart卡'], fee:['Annual fee per bank site','年費依官網'],
   rules:{mobile:{base:null, cond:{rate:3.8, note:['Link Taishin Pay, switch to the "Pay" plan, e-statements and auto-debit','需綁定台新Pay、切換「Pay著刷」方案、電子帳單＋帳戶自扣']}}},

const EXCLUDED = [

  [['Taiwan Business Bank Fu Qi Unlimited','臺灣企銀福企無限卡'],['Annual fee is inconsistent on the page, and the main benefits are premiums and large purchases.','年費頁面前後不一致，且主要權益是保費與大額消費。']],

const $ = id => document.getElementById(id);
const fmt = n => 'NT$' + Math.round(n).toLocaleString('en-US');
const pct = r => (Math.round(r*100)/100) + '%';
let spend = {general:3000, dining:8000, online:5000, mobile:0, transit:0, subs:0, overseas:0, insurance:0};

function ruleFor(card, cat){
  if (card.rules[cat.id]) return card.rules[cat.id];
  if (cat.domestic && card.rules.general) return card.rules.general;
  return null;
}

// Monthly reward for one card, given a spending profile.
function calc(card, sp, condMode){
  const total = CATS.reduce((s,c)=>s+(sp[c.id]||0),0);
  const lines = [], groupUsed = {};
  let sum = 0;
  for (const cat of CATS){
    const a = sp[cat.id]||0; if (!a) continue;
    const rule = ruleFor(card, cat);
    const line = {cat, amount:a, rate:0, reward:0, tags:[], notes:[]};
    if (!rule){ line.tags.push(['none',['Not stated','未說明']]); line.notes.push(['No reward stated for this category','頁面沒寫這類消費的回饋']); lines.push(line); continue; }
    let rate = rule.base, useCond = false;
    if (condMode && rule.cond){
      if (rule.cond.minTotal && total < rule.cond.minTotal){
        line.tags.push(['warn',['Below threshold','未達門檻']]);
        line.notes.push(rule.cond.note, [`Currently ${fmt(total)}`,`目前 ${fmt(total)}`]);
      } else { rate = rule.cond.rate; useCond = true; }
    }
    if (rate == null){
      line.tags.push(['none',['Not stated','未說明']]);
      line.notes.push(rule.cond ? ['Only a conditional bonus is stated, no base rate','只有條件式加碼，沒有基本回饋率'] : ['No reward stated for this category','頁面沒寫這類消費的回饋']);
      lines.push(line); continue;
    }
    let reward = a * rate / 100;
    if (rule.warn && !useCond) line.tags.push(['warn',['Inferred','推算值']]);
    if (useCond){
      line.tags.push(['cond',['Conditions apply','需條件']]); line.notes.push(rule.cond.note);
      if (rule.cond.warn) line.tags.push(['warn',['To be confirmed','數字待確認']]);
      if (rule.cond.capBonus != null){
        const base = rule.base || 0;
        if (a * (rate - base) / 100 > rule.cond.capBonus){
          reward = a*base/100 + rule.cond.capBonus;
          line.tags.push(['cap',['Bonus cap reached','達加碼上限']]);
        }
      }
    } else if (rule.cond && !condMode){
      line.hint = [`Up to ${pct(rule.cond.rate)} with conditions`,`做滿條件可到 ${pct(rule.cond.rate)}`];
    }
    if (rule.note && !line.notes.length) line.notes.push(rule.note);
    if (rule.group){
      const g = card.groups[rule.group], used = groupUsed[rule.group]||0, room = Math.max(0, g.cap - used);
      if (reward > room){ reward = room; line.tags.push(['cap',['Cap reached','達回饋上限']]); line.notes.push(g.label); }
      groupUsed[rule.group] = used + reward;
    }
    line.rate = rate; line.reward = reward; sum += reward;
    lines.push(line);
  }
  return {card, lines, sum};
}

// Best two-card split: each category goes wholly to one of the two cards.
function bestCombo(sp, condMode){
  const cats = CATS.filter(c=>sp[c.id]>0).map(c=>c.id);
  let best = null;
  for (let i=0;i<CARDS.length;i++) for (let j=i+1;j<CARDS.length;j++){
    for (let mask=0; mask < (1<<cats.length); mask++){
      const A={}, B={};
      cats.forEach((c,k)=>{ ((mask>>k)&1 ? B : A)[c] = sp[c]; });
      const s = calc(CARDS[i],A,condMode).sum + calc(CARDS[j],B,condMode).sum;
      if (!best || s > best.sum) best = {sum:s, a:CARDS[i], b:CARDS[j], A:Object.keys(A), B:Object.keys(B)};
    }
  }
  return best;
}

const catName = id => T(CATS.find(c=>c.id===id).name);
const joinList = arr => arr.join(lang==='zh' ? '、' : ', ');

function renderStatic(){
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = (lang==='zh' ? '信用卡回饋推薦器 · 原型' : 'Credit Card Reward Recommender · Prototype') + ' | Bella Chen';
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(UI[el.dataset.i]));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('presets').innerHTML = PRESETS.map((p,i)=>`<button class="chip" type="button" data-p="${i}">${T(p.name)}</button>`).join('');
  $('fields').innerHTML = CATS.map(c=>`<div class="field"><label for="in-${c.id}">${T(c.name)}<small>${T(c.hint)}</small></label><input id="in-${c.id}" type="number" min="0" step="500" inputmode="numeric" value="${spend[c.id]}"></div>`).join('');
  CATS.forEach(c=> $('in-'+c.id).addEventListener('input', e=>{ spend[c.id] = Math.max(0, +e.target.value||0); update(); }));
  $('notes').innerHTML = lang==='zh' ? `
    <h3>資料來源</h3><ul>
      <li>卡片規則整理自 <a href="https://www.money101.com.tw/%E4%BF%A1%E7%94%A8%E5%8D%A1/%E7%B2%BE%E9%81%B8%E6%8E%A8%E8%96%A6" target="_blank" rel="noopener noreferrer">Money101 信用卡精選推薦</a>（2026/11/05 更新），並對照 <a href="https://rich01.com/all-credit-cards-suggest/" target="_blank" rel="noopener noreferrer">市場先生 2026 信用卡回饋比較總覽</a>（2026/10/13 更新），於 2026/11/14 擷取。兩邊數字不一致時，採用拆得比較細的那一邊，並在卡片明細註明。</li>
      <li>僅供試算，不是金融建議。實際回饋、期限與條件以各銀行公告為準。</li></ul>
    <h3>試算假設</h3><ul>
      <li>點數、P 幣、LINE POINTS 一律以 1 點 = NT$1 估算。</li>
      <li>頁面寫「最高 X%」的回饋，視為需要額外條件，只在勾選「把最高回饋也算進來」時計入。</li>
      <li>頁面沒寫某類消費的回饋時，不計入，並在明細標示「未說明」。保費不套用一般消費回饋，除非頁面有寫。</li>
      <li>頁面沒寫上限期間的，一律以「每月」計算。新戶限定加碼不計入。</li>
      <li>兩卡組合：每一類消費整類交給其中一張卡，找出合計回饋最高的分配方式。</li></ul>
    <h3>這一版沒有放進來的卡</h3><ul>${EXCLUDED.map(e=>`<li>${T(e[0])}：${T(e[1])}</li>`).join('')}</ul>` : `
    <h3>Sources</h3><ul>
      <li>Card rules from <a href="https://www.money101.com.tw/%E4%BF%A1%E7%94%A8%E5%8D%A1/%E7%B2%BE%E9%81%B8%E6%8E%A8%E8%96%A6" target="_blank" rel="noopener noreferrer">Money101's featured cards</a> (updated 2026/11/05), cross-checked against <a href="https://rich01.com/all-credit-cards-suggest/" target="_blank" rel="noopener noreferrer">Mr.Market's 2026 card reward overview</a> (updated 2026/10/13), collected 2026/11/14. Where they disagree, the more detailed breakdown is used and noted on the card.</li>
      <li>For estimates only, not financial advice. Each bank's own terms decide actual rewards, dates and conditions.</li></ul>
    <h3>Assumptions</h3><ul>
      <li>Points, P coins and LINE POINTS are valued at 1 point = NT$1.</li>
      <li>Rates shown as "up to X%" are treated as conditional and counted only when "Include up-to rewards" is ticked.</li>
      <li>A category with no stated reward is not counted and is marked "Not stated". Premiums never fall back to the general rate unless stated.</li>
      <li>Caps with no stated period are treated as monthly. New-customer bonuses are not counted.</li>
      <li>Two-card split: each category goes wholly to one card; the split with the highest total wins.</li></ul>
    <h3>Cards left out of this version</h3><ul>${EXCLUDED.map(e=>`<li>${T(e[0])}: ${T(e[1])}</li>`).join('')}</ul>`;
}

function update(){
  const condMode = $('condMode').checked;
  const total = CATS.reduce((s,c)=>s+spend[c.id],0);
  $('total').textContent = fmt(total);
  const results = CARDS.map(c=>calc(c, spend, condMode)).sort((a,b)=>b.sum-a.sum);
  const top = results[0];
  if (!total || !top.sum){
    $('hero').innerHTML = `<div class="label">${T(['Recommendation','推薦'])}</div><div class="name">${T(['Enter your monthly spending first','先填入每月消費'])}</div><div class="why">${T(['Fill in the amounts on the left, or pick a profile to try.','左邊填好金額，或點一個情境試試看。'])}</div>`;
    $('combo').style.display='none'; $('list').innerHTML=''; return;
  }
  const main = [...top.lines].sort((a,b)=>b.reward-a.reward)[0];
  const eff = top.sum/total*100;
  $('hero').innerHTML = `
    <div class="label">${T(['Best card for you','最適合你的卡'])}</div>
    <div class="name">${T(top.card.name)}</div>
    <div class="bank">${T(top.card.bank)} · ${T(top.card.fee)}</div>
    <div class="amount num">${fmt(top.sum)}<span>${T([`/ month, about ${fmt(top.sum*12)} a year`,`／月，一年約 ${fmt(top.sum*12)}`])}</span></div>
    <div class="why">${lang==='zh'
      ? `整體回饋率約 ${pct(eff)}。回饋最多的是「${T(main.cat.name)}」，貢獻 ${fmt(main.reward)}。${condMode?'（已計入需要條件的加碼）':'（只算不用做任何事就拿得到的回饋）'}`
      : `Overall about ${pct(eff)}. Most of it comes from ${T(main.cat.name).toLowerCase()}: ${fmt(main.reward)}. ${condMode?'(Conditional bonuses included.)':'(Only rewards you get without doing anything.)'}`}</div>`;

  const combo = bestCombo(spend, condMode), gain = combo.sum - top.sum, box = $('combo');
  box.style.display = '';
  if (gain >= 1 && combo.A.length && combo.B.length){
    box.innerHTML = lang==='zh'
      ? `<b>兩張卡搭配</b>：${joinList(combo.A.map(catName))} 刷 <b>${T(combo.a.name)}</b>，${joinList(combo.B.map(catName))} 刷 <b>${T(combo.b.name)}</b>，每月合計 <b class="num">${fmt(combo.sum)}</b>，比只用一張多 <b class="num">${fmt(gain)}</b>。`
      : `<b>Two-card split</b>: ${joinList(combo.A.map(catName))} on <b>${T(combo.a.name)}</b>, ${joinList(combo.B.map(catName))} on <b>${T(combo.b.name)}</b> — <b class="num">${fmt(combo.sum)}</b> a month, <b class="num">${fmt(gain)}</b> more than one card.`;
  } else {
    box.innerHTML = T(['<b>Two-card split</b>: for this spending, a second card adds almost nothing. One is enough.','<b>兩張卡搭配</b>：以你的消費來看，多辦一張卡不會多拿多少，用一張就夠了。']);
  }

  const head = T(['Category','類別']), hA = T(['Amount','金額']), hR = T(['Rate','回饋率']), hW = T(['Reward','回饋']), hN = T(['Notes','說明']);
  $('list').innerHTML = results.map((r,i)=>{
    const rows = r.lines.map(l=>`<tr><td>${T(l.cat.name)}</td><td class="r">${fmt(l.amount)}</td><td class="r">${l.rate?pct(l.rate):'—'}</td><td class="r">${fmt(l.reward)}</td><td>${l.tags.map(t=>`<span class="tag ${t[0]}">${T(t[1])}</span>`).join('')}${l.hint?`<span class="tag cond">${T(l.hint)}</span>`:''}${l.notes.length?`<div class="meta" style="margin:2px 0 0">${l.notes.map(T).join(lang==='zh'?'；':'; ')}</div>`:''}</td></tr>`).join('');
    return `<details class="card"${i===0?' open':''}>
      <summary><span class="rank num">${String(i+1).padStart(2,'0')}</span>
        <span class="cname">${T(r.card.name)}<small>${T(r.card.bank)}</small></span>
        <span class="cval num"><b>${fmt(r.sum)}</b><small>${T(['overall ','整體 '])}${pct(total? r.sum/total*100 : 0)}</small></span>
        <span class="bar"><i style="width:${top.sum? r.sum/top.sum*100 : 0}%"></i></span></summary>
      <div class="body">
        <div class="meta">${T(r.card.note)} ${T(r.card.fee)}</div>
        ${r.card.warn?`<div class="meta warn">${T(r.card.warn)}</div>`:''}
        <div class="tbl"><table><thead><tr><th>${head}</th><th class="r">${hA}</th><th class="r">${hR}</th><th class="r">${hW}</th><th>${hN}</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div></details>`;
  }).join('');
}

function setLang(v, save){
  lang = v === 'zh' ? 'zh' : 'en';
  if (save){ try { localStorage.setItem(SITE_LANG_KEY, lang); } catch(e){} }
  renderStatic(); update();
}

$('presets').addEventListener('click', e => {
  const i = e.target.dataset.p; if (i == null) return;
  spend = Object.fromEntries(CATS.map(c=>[c.id, PRESETS[i].v[c.id]||0]));
  CATS.forEach(c=> $('in-'+c.id).value = spend[c.id]); update();
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
addEventListener('storage', e => { if (e.key === SITE_LANG_KEY && e.newValue) setLang(e.newValue, false); });
$('condMode').addEventListener('change', update);
setLang(lang, false);
</script>
