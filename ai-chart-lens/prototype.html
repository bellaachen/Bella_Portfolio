<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI Chart — a de-branded concept prototype for AI-assisted chart analysis. Simulated market data and rule-based responses.">
<link rel="icon" href="../favicon.ico" sizes="32x32"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><title>AI Chart — Chart Analysis Concept</title>
<style>
:root{--ink:#16273a;--muted:#5f7083;--teal:#236b73;--line:#e4e9ed;--pale:#f7f9fa;--up:#2f8f83;--down:#d0605e;--sel:#2f6fde}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #8bbfc4;outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;white-space:nowrap}
.brand small{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--teal);border:1px solid #bcd8db;border-radius:4px;padding:1px 6px}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--muted);min-height:40px}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--teal);font-weight:650}
.tf{display:flex;gap:2px}
.tf button{border:0;background:none;padding:6px 9px;border-radius:5px;color:var(--muted);min-height:36px}
.tf button[aria-pressed=true]{background:#e8f1f2;color:var(--teal);font-weight:700}
.spacer{flex:1}
.lang{display:flex;gap:4px}
.lang button{border:1px solid #d6e1e5;background:#fff;border-radius:999px;padding:0 10px;min-height:30px;font-size:11px;font-weight:750;color:#58727b}
.lang button[aria-pressed=true]{background:#173d4d;border-color:#173d4d;color:#fff}
.back{font-size:12px;font-weight:700;color:var(--teal);text-decoration:none;white-space:nowrap}
.ohlc{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ohlc strong{color:var(--ink)}
.ohlc .hint{margin-left:auto;display:flex;align-items:center;gap:6px}
.ohlc .dot{width:7px;height:7px;border-radius:50%;background:var(--sel)}
main{flex:1;display:flex;min-height:0}
.chartwrap{flex:1;position:relative;min-width:0;touch-action:none;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.panel{width:380px;flex:0 0 380px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.phead{padding:14px 18px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.phead .meta{font-size:12px;color:var(--muted);margin-top:4px}
.trend{font-weight:700}
.trend.up{color:var(--up)}.trend.down{color:var(--down)}.trend.side{color:#b7791f}
.pbody{flex:1;overflow:auto;padding:16px 18px}
.welcome{text-align:center;padding:12px 0}
.welcome h3{margin:10px 0 4px;font-size:18px}
.welcome p{color:var(--muted);margin:0 0 16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--pale);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.steps b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;display:grid;place-items:center}
.card{border-bottom:1px solid var(--line);padding:12px 0}
.card h4{margin:0 0 4px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.card p{margin:0}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chat .label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.msg{max-width:88%;padding:9px 12px;border-radius:10px}
.msg.me{align-self:flex-end;background:#e8f1f2}
.msg.ai{align-self:flex-start;background:var(--pale);border:1px solid var(--line)}
.pfoot{border-top:1px solid var(--line);padding:12px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid #9cc3c7;background:#fff;color:var(--teal);border-radius:999px;padding:0 12px;min-height:34px;font-size:13px}
.chips button:disabled{opacity:.4;cursor:default}
.ask{display:flex;gap:8px}
.ask textarea{flex:1;resize:none;border:1px solid #d5dde3;border-radius:8px;padding:9px 11px;font:inherit;min-height:44px;height:44px}
.ask button{border:0;border-radius:8px;background:var(--teal);color:#fff;padding:0 14px;min-height:44px}
.ask button:disabled{background:#a9c3c6}
.disclaimer{font-size:11px;color:var(--muted);margin:8px 0 0;text-align:center}
.note{padding:7px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--pale);text-align:center}
@media(max-width:820px){
  main{flex-direction:column}
  .chartwrap{flex:0 0 360px}
  .panel{width:auto;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  .pbody{overflow:visible}
  body{height:auto}
  .ohlc .hint{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span data-i="name">AI Chart</span><small data-i="concept">CONCEPT</small></div>
  <div class="tabs" role="group" aria-label="Symbol" id="symbols"></div>
  <div class="tf" role="group" aria-label="Timeframe" id="timeframes"></div>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div>
  <a class="back" href="../index.html#ai-workflow" data-i="back">← Portfolio</a>
</header>
<div class="ohlc" id="ohlc"></div>
<main>
  <div class="chartwrap" id="chartwrap" role="img" aria-label="Simulated candlestick chart. Drag across candles to select a range for analysis.">
    <canvas id="chart"></canvas>
  </div>
  <aside class="panel" aria-label="Analysis panel">
    <div class="phead"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg><span data-i="name">AI Chart</span></h2><div class="meta" id="meta"></div></div>
    <div class="pbody" id="pbody" aria-live="polite"></div>
    <div class="pfoot">
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask"><textarea id="q" rows="1" aria-label="Ask about the selected chart area"></textarea><button type="submit" id="send" aria-label="Send">↑</button></form>
      <p class="disclaimer" data-i="disclaimer">Concept prototype: simulated data and rule-based responses, not a live AI model.</p>
    </div>
  </aside>
</main>
<div class="note" data-i="note">De-branded reconstruction of an AI chart-analysis prototype I built with AI-assisted coding. No company branding or real account data.</div>

<script>
(function(){
const T={
 en:{name:'AI Chart',concept:'CONCEPT',back:'← Portfolio',hint:'Click & drag on the chart to analyze an area',
  disclaimer:'Concept prototype: simulated data and rule-based responses, not a live AI model.',
  note:'De-branded reconstruction of an AI chart-analysis prototype I built with AI-assisted coding. No company branding or real account data.',
  welcomeT:'Analyze any part of the chart',welcomeP:'Select candles, get a structured read, then ask follow-up questions.',
  s1:'Click and drag on the chart to draw a selection',s2:'The selected candles are summarized instantly',s3:'Ask follow-up questions below',
  placeholder:'Ask about the selected area…',needSel:'Select an area on the chart first.',
  candles:'candles',up:'Uptrend',down:'Downtrend',side:'Sideways',
  hTrend:'TREND DIRECTION',hSR:'SUPPORT / RESISTANCE',hPat:'CANDLE PATTERN',hVol:'VOLATILITY',hNext:'WHAT TO WATCH',hRisk:'RISK REMINDER',
  chat:'CHAT',you:'You',
  c1:'What does this mean?',c2:"Where's support?",c3:'Is a breakout coming?',c4:'Explain simply'},
 zh:{name:'AI Chart',concept:'概念原型',back:'← 回到作品集',hint:'在圖表上拖曳，選取要分析的區間',
  disclaimer:'概念原型：行情為模擬資料，回覆為規則產生，並非即時 AI 模型。',
  note:'這是我用 AI 輔助開發的 AI 圖表分析原型的去品牌重建版，不含公司品牌與真實帳戶資料。',
  welcomeT:'分析圖表上的任一區間',welcomeP:'選取 K 線，取得結構化解讀，再繼續追問。',
  s1:'在圖表上按住並拖曳，框選區間',s2:'系統立即摘要所選 K 線',s3:'在下方繼續提問',
  placeholder:'針對選取區間提問…',needSel:'請先在圖表上選取區間。',
  candles:'根 K 線',up:'上升趨勢',down:'下降趨勢',side:'盤整',
  hTrend:'趨勢方向',hSR:'支撐與壓力',hPat:'K 線型態',hVol:'波動程度',hNext:'接下來觀察',hRisk:'風險提醒',
  chat:'對話',you:'你',
  c1:'這代表什麼？',c2:'支撐在哪裡？',c3:'會突破嗎？',c4:'簡單解釋'}
};
let L='en';try{L=localStorage.getItem('bella-portfolio-language')==='zh'?'zh':'en'}catch(e){}
const t=k=>T[L][k];

/* ---------- simulated market data (seeded, deterministic) ---------- */
const SYMBOLS=[{s:'EURUSD',p:1.0850,d:5},{s:'GBPJPY',p:191.40,d:3},{s:'XAUUSD',p:2365.0,d:2}];
const TFS=['15m','1H','4H','1D'];
let sym=0,tf=3,candles=[],sel=null,chat=[];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function gen(){
  const r=rng((sym+1)*97+(tf+1)*13),S=SYMBOLS[sym],n=60,vol=S.p*[0.0012,0.0022,0.004,0.007][tf];
  let c=S.p,out=[],drift=0;
  for(let i=0;i<n;i++){
    if(i%15===0)drift=(r()-.5)*vol*.5;
    const o=c,ch=drift+(r()-.5)*vol*1.6,cl=o+ch,h=Math.max(o,cl)+r()*vol*.7,l=Math.min(o,cl)-r()*vol*.7;
    out.push({o,h,l,c:cl});c=cl;
  }
  const step=[15,60,240,1440][tf],end=new Date(2026,9,30,16,0).getTime();
  out.forEach((k,i)=>k.t=new Date(end-(n-1-i)*step*60000));
  return out;
}
const fmt=v=>v.toFixed(SYMBOLS[sym].d);
const fmtT=d=>tf===3?d.toLocaleDateString(L==='zh'?'zh-TW':'en-US',{month:'short',day:'numeric'}):d.toLocaleString(L==='zh'?'zh-TW':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});

/* ---------- chart ---------- */
const wrap=document.getElementById('chartwrap'),cv=document.getElementById('chart'),ctx=cv.getContext('2d');
let geo={};
function draw(){
  const dpr=window.devicePixelRatio||1,W=wrap.clientWidth,H=wrap.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const padR=72,padT=16,padB=28,cw=W-padR,ch=H-padT-padB;
  const hi=Math.max(...candles.map(k=>k.h)),lo=Math.min(...candles.map(k=>k.l)),m=(hi-lo)*.06;
  const max=hi+m,min=lo-m,y=v=>padT+(max-v)/(max-min)*ch,step=cw/candles.length;
  geo={step,cw,y,padT,ch,max,min};
  ctx.font='11px -apple-system,Segoe UI,Arial';ctx.textBaseline='middle';
  for(let i=0;i<=6;i++){const v=min+(max-min)*i/6,yy=y(v);ctx.strokeStyle='#eef2f4';ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(cw,yy);ctx.stroke();ctx.fillStyle='#7a8898';ctx.fillText(fmt(v),cw+8,yy)}
  ctx.fillStyle='#7a8898';ctx.textBaseline='alphabetic';
  [0,Math.floor(candles.length/2),candles.length-1].forEach(i=>{const x=Math.min(i*step+2,cw-70);ctx.fillText(fmtT(candles[i].t),x,H-9)});
  if(sel){const [a,b]=sel,x0=a*step,x1=(b+1)*step,s=stats();ctx.fillStyle='rgba(47,111,222,.08)';ctx.fillRect(x0,y(s.hi),x1-x0,y(s.lo)-y(s.hi));ctx.setLineDash([5,4]);ctx.strokeStyle='#2f6fde';ctx.strokeRect(x0,y(s.hi),x1-x0,y(s.lo)-y(s.hi));ctx.setLineDash([]);
    [s.hi,s.lo].forEach(v=>{ctx.fillStyle='#2f6fde';ctx.fillRect(cw+2,y(v)-9,padR-4,18);ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(fmt(v),cw+8,y(v))});
    ctx.fillStyle='#2f6fde';const lab=s.n+' '+t('candles');ctx.textBaseline='middle';const lw=ctx.measureText(lab).width+12;ctx.fillRect(x0+(x1-x0-lw)/2,y(s.hi)-22,lw,18);ctx.fillStyle='#fff';ctx.fillText(lab,x0+(x1-x0-lw)/2+6,y(s.hi)-13)}
  candles.forEach((k,i)=>{const x=i*step+step/2,up=k.c>=k.o,col=up?'#2f8f83':'#d0605e';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y(k.h));ctx.lineTo(x,y(k.l));ctx.stroke();const bw=Math.max(2,step*.62),top=y(Math.max(k.o,k.c)),bh=Math.max(1,Math.abs(y(k.o)-y(k.c)));ctx.fillRect(x-bw/2,top,bw,bh)});
  const last=candles[candles.length-1],ly=y(last.c);ctx.setLineDash([3,3]);ctx.strokeStyle='#2f8f83';ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(cw,ly);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#2f8f83';ctx.fillRect(cw+2,ly-9,padR-4,18);ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(fmt(last.c),cw+8,ly);
  if(drag){ctx.strokeStyle='#2f6fde';ctx.setLineDash([4,3]);ctx.strokeRect(Math.min(drag.x0,drag.x1),padT,Math.abs(drag.x1-drag.x0),ch);ctx.setLineDash([])}
}
let drag=null;
const idx=x=>Math.max(0,Math.min(candles.length-1,Math.floor(x/geo.step)));
wrap.addEventListener('pointerdown',e=>{const r=wrap.getBoundingClientRect(),x=e.clientX-r.left;if(x>geo.cw)return;drag={x0:x,x1:x};wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{const r=wrap.getBoundingClientRect(),x=Math.min(e.clientX-r.left,geo.cw);if(drag){drag.x1=Math.max(0,x);draw()}else if(x>=0&&x<=geo.cw){showOHLC(candles[idx(x)])}});
wrap.addEventListener('pointerup',()=>{if(!drag)return;let a=idx(Math.min(drag.x0,drag.x1)),b=idx(Math.max(drag.x0,drag.x1));drag=null;if(b-a<2){draw();return}sel=[a,b];chat=[];draw();render()});
wrap.addEventListener('pointerleave',()=>showOHLC(candles[candles.length-1]));

/* ---------- rule-based analysis ---------- */
function stats(){
  const ks=candles.slice(sel[0],sel[1]+1),hi=Math.max(...ks.map(k=>k.h)),lo=Math.min(...ks.map(k=>k.l)),rg=hi-lo;
  const move=ks[ks.length-1].c-ks[0].o,dir=move/rg>.35?'up':move/rg<-.35?'down':'side';
  const avgR=a=>a.reduce((s,k)=>s+(k.h-k.l),0)/a.length,rel=avgR(ks)/avgR(candles);
  const doji=ks.filter(k=>Math.abs(k.c-k.o)<(k.h-k.l)*.25).length,bull=ks.filter(k=>k.c>k.o).length;
  return{ks,n:ks.length,hi,lo,mid:(hi+lo)/2,dir,rel,doji,bull,bear:ks.length-bull,from:ks[0].t,to:ks[ks.length-1].t,last:ks[ks.length-1].c};
}
function analysis(s){
  const zh=L==='zh',v=s.rel<.85?(zh?'偏低':'low'):s.rel>1.2?(zh?'偏高':'high'):(zh?'正常':'normal');
  const trend={up:zh?`上升：區間內收盤由低走高，買方主導 ${s.bull}/${s.n} 根。`:`Upward: closes stepped higher across the range, with ${s.bull} of ${s.n} candles bullish.`,
    down:zh?`下降：區間內收盤逐步走低，賣方主導 ${s.bear}/${s.n} 根。`:`Downward: closes stepped lower across the range, with ${s.bear} of ${s.n} candles bearish.`,
    side:zh?'盤整：價格在上下界之間來回，沒有明確方向。':'Sideways: price is rotating between a floor and a ceiling with no clear direction.'}[s.dir];
  const sr=zh?`支撐約 ${fmt(s.lo)}，壓力約 ${fmt(s.hi)}，中點 ${fmt(s.mid)} 可作為觀察樞紐。`:`Support near ${fmt(s.lo)}, resistance near ${fmt(s.hi)}. The midpoint ${fmt(s.mid)} is a pivot to watch.`;
  const pat=s.doji>=s.n*.3?(zh?`${s.doji} 根十字或小實體 K 線，顯示多空拉鋸。`:`${s.doji} doji or small-bodied candles, a sign of indecision.`):(zh?`實體 K 線為主（陽線 ${s.bull}、陰線 ${s.bear}），方向性較明確。`:`Mostly full-bodied candles (${s.bull} up, ${s.bear} down), so moves were decisive.`);
  const vol=zh?`波動${v}：平均振幅約為整張圖的 ${Math.round(s.rel*100)}%。`:`Volatility is ${v}: the average candle range is about ${Math.round(s.rel*100)}% of the chart average.`;
  const next={up:zh?`觀察能否守在 ${fmt(s.mid)} 之上；跌破代表動能轉弱。`:`Watch whether price holds above ${fmt(s.mid)}; a break below would signal fading momentum.`,
    down:zh?`觀察能否重回 ${fmt(s.mid)} 之上；無法站回則弱勢延續。`:`Watch for a reclaim of ${fmt(s.mid)}; failing that, weakness may continue.`,
    side:zh?'等待 K 線收盤確實突破上界或跌破下界，再判斷方向。':'Wait for a candle to close outside the range before reading a direction.'}[s.dir];
  const risk=zh?'這是對過去走勢的描述，不是交易建議。假突破很常見，請以收盤確認。':'This describes past price action and is not trading advice. False breakouts are common; confirm on a close.';
  return[[t('hTrend'),trend],[t('hSR'),sr],[t('hPat'),pat],[t('hVol'),vol],[t('hNext'),next],[t('hRisk'),risk]];
}
function answer(k,s){
  const zh=L==='zh';
  return{c1:zh?`所選 ${s.n} 根 K 線呈現「${t(s.dir)}」。重點是 ${fmt(s.lo)} 到 ${fmt(s.hi)} 這段區間，價格離開區間前，方向都還不確定。`:`The ${s.n} selected candles show a ${t(s.dir).toLowerCase()} market. The key zone is ${fmt(s.lo)} to ${fmt(s.hi)}; until price leaves it, direction is unconfirmed.`,
    c2:zh?`主要支撐在 ${fmt(s.lo)}（區間低點），其次是中點 ${fmt(s.mid)}。`:`Main support is ${fmt(s.lo)}, the low of the selection, with the midpoint ${fmt(s.mid)} as a secondary level.`,
    c3:zh?`目前收在 ${fmt(s.last)}，${s.last>s.mid?'較接近上緣':'較接近下緣'}。${s.rel<.85?'波動收斂，常見於突破之前，':''}仍需收盤確認，不能只看影線。`:`The last close is ${fmt(s.last)}, ${s.last>s.mid?'closer to the top':'closer to the bottom'} of the range. ${s.rel<.85?'Volatility is compressing, which often comes before a breakout, but ':''}a close outside the range is needed, not just a wick.`,
    c4:zh?`簡單說：價格大多在 ${fmt(s.lo)} 和 ${fmt(s.hi)} 之間。${s.dir==='up'?'整體往上走。':s.dir==='down'?'整體往下走。':'還沒決定方向。'}`:`Simply put: price mostly stayed between ${fmt(s.lo)} and ${fmt(s.hi)}, and it is ${s.dir==='up'?'drifting up':s.dir==='down'?'drifting down':'not committed to a direction yet'}.`,
    free:zh?`在這個概念原型中，自由提問會以所選區間的數據回覆：區間 ${fmt(s.lo)}–${fmt(s.hi)}，${t(s.dir)}，波動約為平均的 ${Math.round(s.rel*100)}%。正式版本會交給 AI 模型回答。`:`In this concept prototype, free-form questions get a data summary of your selection: range ${fmt(s.lo)}–${fmt(s.hi)}, ${t(s.dir).toLowerCase()}, volatility about ${Math.round(s.rel*100)}% of average. The production version routes this to an AI model.`}[k];
}

/* ---------- panel ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
  document.getElementById('q').placeholder=t('placeholder');
  const S=SYMBOLS[sym].s,pb=document.getElementById('pbody'),meta=document.getElementById('meta');
  if(!sel){meta.textContent=S+' · '+TFS[tf];
    pb.innerHTML=`<div class="welcome"><h3>${t('welcomeT')}</h3><p>${t('welcomeP')}</p><ol class="steps"><li><b>1</b><span>${t('s1')}</span></li><li><b>2</b><span>${t('s2')}</span></li><li><b>3</b><span>${t('s3')}</span></li></ol></div>`;
  }else{const s=stats();
    meta.innerHTML=`${S} · ${TFS[tf]} · ${fmtT(s.from)} – ${fmtT(s.to)} · <span class="trend ${s.dir}">${t(s.dir)}</span>`;
    pb.innerHTML=analysis(s).map(([h,p])=>`<div class="card"><h4>${h}</h4><p>${esc(p)}</p></div>`).join('')+
      (chat.length?`<div class="chat"><div class="label">${t('chat')}</div>${chat.map(m=>`<div class="msg ${m.me?'me':'ai'}">${esc(m.text)}</div>`).join('')}</div>`:'');
    pb.scrollTop=pb.scrollHeight}
  document.getElementById('chips').innerHTML=['c1','c2','c3','c4'].map(k=>`<button type="button" data-chip="${k}" ${sel?'':'disabled'}>${t(k)}</button>`).join('');
  document.getElementById('send').disabled=!sel;
  document.getElementById('symbols').innerHTML=SYMBOLS.map((x,i)=>`<button type="button" data-sym="${i}" aria-pressed="${i===sym}">${x.s}</button>`).join('');
  document.getElementById('timeframes').innerHTML=TFS.map((x,i)=>`<button type="button" data-tf="${i}" aria-pressed="${i===tf}">${x}</button>`).join('');
  showOHLC(candles[candles.length-1]);
}
function showOHLC(k){document.getElementById('ohlc').innerHTML=`<strong>${SYMBOLS[sym].s}</strong><span>O <strong>${fmt(k.o)}</strong></span><span>H <strong>${fmt(k.h)}</strong></span><span>L <strong>${fmt(k.l)}</strong></span><span>C <strong>${fmt(k.c)}</strong></span><span class="hint"><span class="dot"></span>${t('hint')}</span>`}
function ask(key,text){if(!sel)return;chat.push({me:true,text},{me:false,text:answer(key,stats())});render()}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(b)ask(b.dataset.chip,t(b.dataset.chip))});
document.getElementById('ask').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('q'),v=q.value.trim();if(!v||!sel)return;q.value='';ask('free',v)});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('ask').requestSubmit()}});
document.getElementById('symbols').addEventListener('click',e=>{const b=e.target.closest('[data-sym]');if(!b)return;sym=+b.dataset.sym;reset()});
document.getElementById('timeframes').addEventListener('click',e=>{const b=e.target.closest('[data-tf]');if(!b)return;tf=+b.dataset.tf;reset()});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{L=b.dataset.lang;try{localStorage.setItem('bella-portfolio-language',L)}catch(e){}render();draw()}));
function reset(){candles=gen();sel=null;chat=[];render();draw()}
new ResizeObserver(()=>draw()).observe(wrap);
reset();
})();
</script>
</body>
</html>
